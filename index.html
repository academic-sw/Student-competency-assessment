/* ============================================================
   2. API SERVICE (Google Apps Script Integration)
============================================================ */
const API = {
  isConnected() {
    return !!CONFIG.getScriptUrl();
  },
  async request(action, data = {}) {
    const url = CONFIG.getScriptUrl();
    if (!url) return null;
    try {
      const payload = { action, ...data };
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    } catch (e) {
      console.warn('API Request Failed:', e);
      return { status: 'error', message: e.message };
    }
  },
  async syncAllFromCloud() {
    const res = await this.request('getAll');
    if (res && res.data) {
      if (res.data.settings) DB.set('settings', res.data.settings);
      if (res.data.users && res.data.users.length) DB.set('users', res.data.users);
      if (res.data.terms && res.data.terms.length) DB.set('terms', res.data.terms);
      if (res.data.subjectGroups && res.data.subjectGroups.length) DB.set('subjectGroups', res.data.subjectGroups);
      if (res.data.subjects && res.data.subjects.length) DB.set('subjects', res.data.subjects);
      if (res.data.classes && res.data.classes.length) DB.set('classes', res.data.classes);
      if (res.data.students && res.data.students.length) DB.set('students', res.data.students);
      if (res.data.topics) DB.set('topics', res.data.topics);
      if (res.data.evaluations && Array.isArray(res.data.evaluations)) {
        const localEvals = DB.get('evaluations', []);
        const cloudEvals = res.data.evaluations;
        const map = new Map();
        cloudEvals.forEach(e => map.set(String(e.id), e));
        localEvals.forEach(e => {
          const sid = String(e.id);
          if (!map.has(sid)) {
            map.set(sid, e);
          } else {
            const cloudItem = map.get(sid);
            const lt = new Date(e.updatedAt || 0).getTime();
            const ct = new Date(cloudItem.updatedAt || 0).getTime();
            if (lt > ct) map.set(sid, e);
          }
        });
        DB.set('evaluations', Array.from(map.values()));
      }
      return true;
    }
    return false;
  },
  async uploadFileToDrive(filename, mimeType, base64) {
    if (!this.isConnected()) return null;
    const res = await this.request('uploadFile', { filename, mimeType, base64 });
    if (res && res.url) return res.url;
    return null;
  }
};

/* ============================================================
   4. COMPUTATION LOGIC (Hierarchical Bottom-Up Averaging)
============================================================ */
function leavesOf(node){
  if (!node.children || !node.children.length) return [node];
  return node.children.flatMap(leavesOf);
}

function computeNodeScore(node, scores){
  const kids = node.children || [];
  if (!kids.length) {
    const raw = (scores && scores[node.id] !== undefined && scores[node.id] !== null && scores[node.id] !== '')
      ? Number(scores[node.id])
      : null;
    const isEval = (raw !== null && !isNaN(raw));
    return {
      id: node.id,
      name: node.name,
      isLeaf: true,
      avg: isEval ? raw : null,
      evaluated: isEval,
      totalLeaves: 1,
      evaluatedLeaves: isEval ? 1 : 0
    };
  }

  let sumAvg = 0;
  let evalKids = 0;
  let totalLeaves = 0;
  let evaluatedLeaves = 0;
  const childResults = [];

  for (const child of kids) {
    const res = computeNodeScore(child, scores);
    childResults.push(res);
    totalLeaves += res.totalLeaves;
    evaluatedLeaves += res.evaluatedLeaves;
    if (res.avg !== null && !isNaN(res.avg)) {
      sumAvg += res.avg;
      evalKids++;
    }
  }

  const avg = evalKids > 0 ? (sumAvg / evalKids) : null;
  return {
    id: node.id,
    name: node.name,
    isLeaf: false,
    avg: avg,
    evaluated: evalKids > 0,
    totalLeaves,
    evaluatedLeaves,
    childResults
  };
}

function computeFromTopics(scores, topicList){
  if (!topicList || !topicList.length) {
    return { avg: 0, level: 0, topics: [], totalLeaves: 0, evaluatedLeaves: 0, nodeMap: {} };
  }

  let sumMainAvg = 0;
  let evalMainCount = 0;
  let totalLeaves = 0;
  let evaluatedLeaves = 0;
  const nodeMap = {};

  function traverseMap(res){
    if (!res) return;
    nodeMap[res.id] = res;
    if (res.childResults) {
      res.childResults.forEach(traverseMap);
    }
  }

  const topicStats = topicList.map(t => {
    const res = computeNodeScore(t, scores);
    traverseMap(res);
    totalLeaves += res.totalLeaves;
    evaluatedLeaves += res.evaluatedLeaves;
    const avg = (res.avg !== null && !isNaN(res.avg)) ? res.avg : 0;
    if (res.avg !== null && !isNaN(res.avg)) {
      sumMainAvg += res.avg;
      evalMainCount++;
    }
    return {
      id: t.id,
      name: t.name,
      avg: avg,
      level: levelFromAvg(avg),
      count: res.evaluatedLeaves,
      total: res.totalLeaves,
      hasScore: (res.avg !== null && !isNaN(res.avg)),
      nodeRes: res
    };
  });

  const overallAvg = evalMainCount > 0 ? (sumMainAvg / evalMainCount) : 0;
  return {
    avg: overallAvg,
    level: levelFromAvg(overallAvg),
    topics: topicStats,
    totalLeaves,
    evaluatedLeaves,
    nodeMap
  };
}

function evalResult(ev){
  const topics = getTopics();
  return computeFromTopics(ev.scores || {}, topics[ev.type] || []);
}

/**
 * แดชบอร์ดภาพรวม: คิดคะแนนเฉลี่ยเฉพาะรายการและนักเรียนที่ได้รับการประเมินจริงเท่านั้น
 * ไม่จำเป็นต้องประเมินทุกวิชา คิดเฉพาะวิชา ระดับชั้น และห้องเรียนที่เลือก/ประเมินจริง
 */
function buildDashboard(termId, subjectId=null, classId=null, levelFilter=null, teacherId=null){
  let evs = getEvals().filter(e => String(e.termId) === String(termId));
  if (teacherId) {
    evs = evs.filter(e => String(e.teacherId) === String(teacherId));
  }
  if (subjectId) {
    evs = evs.filter(e => String(e.subjectId) === String(subjectId));
  }
  if (classId) {
    evs = evs.filter(e => String(e.classId) === String(classId));
  } else if (levelFilter) {
    const classes = getClasses().filter(c => c.level === levelFilter);
    const classIds = new Set(classes.map(c => String(c.id)));
    evs = evs.filter(e => classIds.has(String(e.classId)));
  }

  const validEvs = evs.filter(e => e.avg !== undefined && e.avg !== null && !isNaN(e.avg));
  const totalCount = validEvs.length;

  const rows = validEvs.map(e => {
    const cls = classById(e.classId);
    return {
      studentId: e.studentId,
      level: cls ? cls.level : '-',
      classId: e.classId,
      avg: Number(e.avg || 0),
      q: levelFromAvg(Number(e.avg || 0))
    };
  });

  const avgOf = arr => arr.length ? arr.reduce((a,b)=>a+b.avg,0)/arr.length : 0;
  const school = { avg: avgOf(rows), count: rows.length, level: 0 };
  school.level = levelFromAvg(school.avg);

  const lowerRows = rows.filter(r => LOWER.includes(r.level));
  const upperRows = rows.filter(r => UPPER.includes(r.level));
  const lower = { avg: avgOf(lowerRows), count: lowerRows.length }; lower.level = levelFromAvg(lower.avg);
  const upper = { avg: avgOf(upperRows), count: upperRows.length }; upper.level = levelFromAvg(upper.avg);

  const byLevel = BIG_LEVELS.map(lv => {
    const rr = rows.filter(r => r.level === lv);
    const a = avgOf(rr);
    return { level: lv, avg: a, q: levelFromAvg(a), count: rr.length };
  });

  const dist = [3,2,1,0].map(q => rows.filter(r => r.q === q).length);
  return { school, lower, upper, byLevel, dist, total: totalCount };
}

function pager(total, page, per, key){
  if (total <= per) return '';
  const pages = Math.ceil(total/per);
  let btns = '';
  const start = Math.max(1, Math.min(page-2, pages-4));
  const end = Math.min(pages, start+4);
  for (let i = start; i <= end; i++){
    btns += `<button data-pg="${key}:${i}" class="h-8 min-w-8 rounded-lg px-2 text-xs font-semibold ${i===page?'text-white':'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}"
      ${i===page?'style="background:var(--c-primary)"':''}>${i}</button>`;
  }
  return `<div class="flex flex-wrap items-center justify-between gap-2 px-1 pt-3">
    <span class="text-xs text-slate-500">ทั้งหมด ${total} รายการ · หน้า ${page}/${pages}</span>
    <div class="flex items-center gap-1">
      <button data-pg="${key}:${Math.max(1,page-1)}" class="h-8 rounded-lg border border-slate-200 bg-white px-2 text-xs text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chevron-left"></i></button>
      ${btns}
      <button data-pg="${key}:${Math.min(pages,page+1)}" class="h-8 rounded-lg border border-slate-200 bg-white px-2 text-xs text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chevron-right"></i></button>
    </div></div>`;
}

function hexSoft(hex, alpha=.16){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

const TOPIC_LEVEL_LABELS = [
  'หัวข้อใหญ่',
  'หัวข้อย่อย',
  'หัวข้อย่อยย่อย',
  'หัวข้อย่อยย่อยย่อย',
  'หัวข้อย่อยย่อยย่อยย่อย'
];

const TOPIC_LEVEL_STYLES = [
  { border: 'border-emerald-500', bg: 'bg-emerald-50/50', badge: 'bg-emerald-100 text-emerald-800' },
  { border: 'border-sky-400', bg: 'bg-sky-50/40', badge: 'bg-sky-100 text-sky-800' },
  { border: 'border-amber-400', bg: 'bg-amber-50/40', badge: 'bg-amber-100 text-amber-800' },
  { border: 'border-purple-400', bg: 'bg-purple-50/40', badge: 'bg-purple-100 text-purple-800' },
  { border: 'border-rose-400', bg: 'bg-rose-50/40', badge: 'bg-rose-100 text-rose-800' }
];

function renderAdminTopicNode(node, depth, pathStr) {
  const kids = node.children || [];
  const lvl = Math.min(depth, 4);
  const style = TOPIC_LEVEL_STYLES[lvl];
  const label = TOPIC_LEVEL_LABELS[lvl];
  const canAddChild = depth < 4;
  const nextLabel = canAddChild ? TOPIC_LEVEL_LABELS[depth + 1] : '';

  return `
  <div class="rounded-xl border border-slate-200/90 ${style.bg} p-3 transition hover:border-slate-300">
    <div class="flex flex-wrap items-start justify-between gap-2">
      <div class="flex-1 min-w-[200px]">
        <div class="flex items-center gap-2 mb-1">
          <span class="badge ${style.badge} font-bold text-[10px]">
            <i class="fa-solid fa-layer-group text-[9px]"></i> ระดับ ${depth + 1}: ${label}
          </span>
          ${!kids.length ? `<span class="badge bg-slate-100 text-slate-500 text-[10px]"><i class="fa-solid fa-circle-dot text-[8px] text-emerald-500"></i> ข้อประเมิน (ให้คะแนน)</span>` : ''}
          ${kids.length ? `<span class="badge bg-slate-200/70 text-slate-600 text-[10px]">${kids.length} ข้อย่อย</span>` : ''}
        </div>
        <p class="text-sm font-semibold text-slate-800 leading-snug">${esc(node.name)}</p>
      </div>

      <div class="flex shrink-0 items-center gap-1">
        ${canAddChild ? `
          <button data-add-node="${node.id}" data-depth="${depth}" class="btn btn-ghost h-7 px-2.5 text-xs text-emerald-700 bg-white hover:bg-emerald-50 border border-emerald-300 shadow-2xs font-medium" title="เพิ่ม${nextLabel}">
            <i class="fa-solid fa-plus text-[10px]"></i> ${nextLabel}
          </button>` : ''}
        <button data-edit-node="${node.id}" class="btn btn-ghost h-7 w-7 !p-0 text-sky-600 hover:bg-sky-50" title="แก้ไข"><i class="fa-solid fa-pen text-xs"></i></button>
        <button data-del-node="${node.id}" class="btn btn-ghost h-7 w-7 !p-0 text-rose-500 hover:bg-rose-50" title="ลบ"><i class="fa-solid fa-trash text-xs"></i></button>
      </div>
    </div>

    ${kids.length ? `
      <div class="mt-2.5 space-y-2.5 border-l-2 pl-3 sm:pl-4 border-slate-300">
        ${kids.map((k, ki) => renderAdminTopicNode(k, depth + 1, `${pathStr}.${ki + 1}`)).join('')}
      </div>` : ''}
  </div>`;
}

/* ---------- 8.8 ADMIN : REPORTS (คิดเฉพาะรายการที่ประเมินจริง) ---------- */
function viewReports(){
  const terms = getTerms();
  const cur = currentTerm();
  const evs = getEvals();
  const classes = getClasses();
  const subjects = getSubjects();

  // สร้างรายการสรุปตาม (ห้องเรียน x รายวิชา) ที่ได้รับการประเมินจริง
  const roomSubjectPairs = [];
  const map = new Map();

  evs.forEach(e => {
    const key = `${e.classId}_${e.subjectId}_${e.termId}`;
    if (!map.has(key)) {
      map.set(key, []);
      roomSubjectPairs.push({
        classId: e.classId,
        subjectId: e.subjectId,
        termId: e.termId,
        key
      });
    }
    map.get(key).push(e);
  });

  return `
  <div class="fade-in space-y-4">
    ${pageHeader('รายงานผลการประเมิน','สรุปผลคะแนนเฉลี่ยเฉพาะรายวิชา ระดับชั้น และห้องเรียนที่ได้รับการประเมินจริง','fa-file-lines',
      `<button id="btnSyncClassSheets" class="btn btn-primary px-4 py-2 text-sm">
        <i class="fa-solid fa-file-excel"></i> สร้าง/อัปเดตชีทแยกทุกห้องใน Google Sheets
      </button>`)}
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="tbl">
          <thead><tr>
            <th>ห้องเรียน</th><th>ระดับชั้น</th><th>รายวิชา</th><th>ภาคเรียน</th>
            <th>ประเมินแล้ว</th><th>คะแนนเฉลี่ย</th><th>ระดับคุณภาพ</th>
          </tr></thead>
          <tbody>
            ${roomSubjectPairs.length ? roomSubjectPairs.map(p => {
              const cls = classById(p.classId);
              const subj = subjectById(p.subjectId);
              const term = terms.find(t => String(t.id) === String(p.termId));
              const list = map.get(p.key) || [];
              const validAvgs = list.map(e => Number(e.avg || 0));
              const avg = validAvgs.length ? (validAvgs.reduce((a,b)=>a+b,0) / validAvgs.length) : 0;
              const q = levelFromAvg(avg);

              return `<tr>
                <td class="font-bold text-slate-800">${esc(cls?.name || '-')}</td>
                <td><span class="badge" style="background:var(--c-primary-soft);color:var(--c-primary-dark)">${esc(cls?.level || '-')}</span></td>
                <td class="font-medium text-slate-700">${esc(subj?.name || '-')}</td>
                <td class="text-xs text-slate-500">${termLabel(term)}</td>
                <td><span class="badge bg-slate-100 text-slate-600">${list.length} คน</span></td>
                <td class="font-bold" style="color:${LEVEL_INFO[q].hex}">${fmt(avg)}</td>
                <td>${levelBadge(q)}</td>
              </tr>`;
            }).join('') : `<tr><td colspan="7" class="py-12 text-center text-sm text-slate-400">ยังไม่มีข้อมูลการประเมินในระบบ</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

  </div>`;
}

/* ---------- 8.11 EVALUATE WORKSPACE (ประเมินแยกตามวิชา/ระดับชั้น/ห้องเรียน และคิดค่าเฉลี่ยเฉพาะรายการที่ประเมิน) ---------- */
function viewEvaluate(){
  const cur = currentTerm();
  const subjects = getSubjects();
  const groups = getGroups();
  const classes = getClasses();

  const f = state._evalForm = state._evalForm || {
    subjectId: subjects[0]?.id || '',
    type: 'lower',
    classId: ''
  };

  if (!subjects.some(s => String(s.id) === String(f.subjectId))) {
    f.subjectId = subjects[0]?.id || '';
  }

  // ตัวกรองห้องเรียนตามระดับที่เลือก
  const classOptions = classes.filter(c => (f.type==='lower'?LOWER:UPPER).includes(c.level));
  if (!classOptions.some(c => String(c.id) === String(f.classId))) {
    f.classId = classOptions[0]?.id || '';
  }

  return `
  <div class="fade-in space-y-4">
    ${pageHeader('แบบประเมินสมรรถนะสำคัญของผู้เรียน','เลือกรายวิชา ระดับชั้น และห้องเรียนเพื่อประเมิน (คิดค่าเฉลี่ยเฉพาะวิชาและห้องนี้)','fa-clipboard-check','')}

    <div class="card p-4">
      <div class="grid gap-3 lg:grid-cols-4">
        <div>
          <label class="label"><i class="fa-solid fa-calendar-days mr-1 text-emerald-600"></i>ภาคเรียน / ปีการศึกษา</label>
          <input class="input bg-slate-50 text-slate-600 font-semibold" value="${termLabel(cur)}" readonly>
        </div>
        <div>
          <label class="label"><i class="fa-solid fa-book mr-1 text-emerald-600"></i>รายวิชาที่ต้องการประเมิน *</label>
          <select id="evSubject" class="select font-semibold text-slate-700">
            ${groups.map(g => {
              const list = subjects.filter(s => String(s.groupId) === String(g.id));
              if (!list.length) return '';
              return `<optgroup label="${esc(g.name)}">
                ${list.map(s => `<option value="${s.id}" ${String(s.id)===String(f.subjectId)?'selected':''}>${esc(s.name)}</option>`).join('')}
              </optgroup>`;
            }).join('')}
          </select>
        </div>
        <div>
          <label class="label"><i class="fa-solid fa-layer-group mr-1 text-emerald-600"></i>ระดับการศึกษา *</label>
          <select id="evType" class="select">
            <option value="lower" ${f.type==='lower'?'selected':''}>มัธยมศึกษาตอนต้น (ม.1 - ม.3)</option>
            <option value="upper" ${f.type==='upper'?'selected':''}>มัธยมศึกษาตอนปลาย (ม.4 - ม.6)</option>
          </select>
        </div>
        <div>
          <label class="label"><i class="fa-solid fa-door-open mr-1 text-emerald-600"></i>ห้องเรียนที่ประเมิน *</label>
          <select id="evClass" class="select font-semibold text-slate-700">
            ${classOptions.length ? classOptions.map(c => `<option value="${c.id}" ${String(c.id)===String(f.classId)?'selected':''}>${esc(c.name)} (${esc(c.level)})</option>`).join('')
                                  : '<option value="">— ไม่มีชั้นเรียนในระดับนี้ —</option>'}
          </select>
        </div>
      </div>
    </div>

    <div id="evList"></div>
  </div>`;
}

function renderEvalList(){
  const box = $('#evList'); if (!box) return;
  const f = state._evalForm;
  const cur = currentTerm();
  if (!cur || !f.classId || !f.subjectId){
    box.innerHTML = `<div class="card grid place-items-center p-12 text-center text-slate-400">กรุณาเลือกรายวิชาและห้องเรียนให้ครบถ้วน</div>`;
    return;
  }
  const cls = classById(f.classId);
  const subj = subjectById(f.subjectId);
  const students = getStudents().filter(s => String(s.classId) === String(f.classId)).sort((a,b) => num(a.number)-num(b.number));
  const evs = getEvals().filter(e => String(e.termId) === String(cur.id) && String(e.subjectId) === String(f.subjectId) && String(e.classId) === String(f.classId));

  const results = students.map(s => {
    const ev = evs.find(e => String(e.studentId) === String(s.id));
    return { s, ev, r: ev ? evalResult(ev) : null };
  });

  // คำนวณค่าเฉลี่ยเฉพาะนักเรียนที่ได้รับการประเมินในวิชานี้จริงเท่านั้น!
    const doneList = results.filter(x => x.r && x.r.evaluatedLeaves > 0);
  const completeList = results.filter(x => x.r && x.r.totalLeaves > 0 && x.r.evaluatedLeaves === x.r.totalLeaves);
  const classAvg = doneList.length ? doneList.reduce((a,b)=>a+b.r.avg,0)/doneList.length : 0;
  const classLv = classAvg !== null ? levelFromAvg(classAvg) : 0;

  box.innerHTML = `
  <div class="card overflow-hidden">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 bg-slate-50/70 px-4 py-3">
      <div class="flex flex-wrap items-center gap-2">
        <span class="badge" style="background:var(--c-primary-soft);color:var(--c-primary-dark)">ห้อง ${esc(cls?.name||'')}</span>
        <span class="badge bg-slate-200 text-slate-700">วิชา: ${esc(subj?.name||'')}</span>
        <span class="badge bg-slate-100 text-slate-600">นักเรียนทั้งหมด ${students.length} คน</span>
                <span class="badge ${completeList.length===students.length && students.length>0?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">
          ประเมินครบ ${completeList.length}/${students.length}
        </span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-500">ค่าเฉลี่ยห้อง (เฉพาะวิชานี้):</span>
        <span class="text-xl font-bold font-mono" style="color:${classAvg!==null?LEVEL_INFO[classLv].hex:'#94a3b8'}">${fmt(classAvg)}</span>
        ${classAvg !== null ? levelBadge(classLv) : '<span class="badge bg-slate-100 text-slate-400">ยังไม่มีการประเมิน</span>'}
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="tbl">
        <thead><tr><th>เลขที่</th><th>ชื่อ - นามสกุล</th><th>สถานะในวิชานี้</th><th>คะแนนเฉลี่ย</th><th>ระดับคุณภาพ</th><th class="text-right">จัดการ</th></tr></thead>
        <tbody>
                    ${results.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-400">ยังไม่มีรายชื่อนักเรียนในห้องนี้</td></tr>` : results.map(x => {
            const isComplete = x.r && x.r.totalLeaves > 0 && x.r.evaluatedLeaves === x.r.totalLeaves;
            const hasPartial = x.r && x.r.evaluatedLeaves > 0 && !isComplete;
            const hasAny = isComplete || hasPartial;

            let statusBadge;
            if (isComplete) {
              statusBadge = '<span class="badge bg-green-100 text-green-700"><i class="fa-solid fa-circle-check"></i> ประเมินครบแล้ว</span>';
            } else if (hasPartial) {
              statusBadge = `<span class="badge bg-amber-100 text-amber-700"><i class="fa-solid fa-triangle-exclamation"></i> ยังไม่ครบ ${x.r.evaluatedLeaves}/${x.r.totalLeaves}</span>`;
            } else {
              statusBadge = '<span class="badge bg-slate-100 text-slate-500"><i class="fa-solid fa-clock"></i> รอประเมิน</span>';
            }

            return `
            <tr>
              <td class="font-semibold text-slate-600">${esc(x.s.number)}</td>
              <td class="font-medium text-slate-700">${esc(x.s.name)}</td>
              <td>${statusBadge}</td>
              <td class="font-semibold" style="color:${hasAny?LEVEL_INFO[x.r.level].hex:'#cbd5e1'}">${hasAny?fmt(x.r.avg):'-'}</td>
              <td>${hasAny?levelBadge(x.r.level):'<span class="text-xs text-slate-300">—</span>'}</td>
              <td class="text-right">
                <button type="button" data-eval="${x.s.id}" class="btn ${isComplete?'btn-ghost':'btn-primary'} h-8 px-3 text-xs">
                  <i class="fa-solid ${isComplete?'fa-pen':'fa-clipboard-check'}"></i>
                  ${isComplete?'แก้ไข':(hasPartial?'ประเมินต่อ':'ประเมิน')}
                </button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ============================================================
   9. EVALUATION MODAL (Hierarchical Real-time Scoring)
============================================================ */
const EVAL_LEVEL_STYLES = [
  { border:'border-emerald-300', bg:'bg-emerald-50/20', badge:'bg-emerald-100 text-emerald-800' },
  { border:'border-sky-300',     bg:'bg-sky-50/20',     badge:'bg-sky-100 text-sky-800' },
  { border:'border-amber-300',   bg:'bg-amber-50/20',   badge:'bg-amber-100 text-amber-800' },
  { border:'border-purple-300',  bg:'bg-purple-50/20',  badge:'bg-purple-100 text-purple-800' },
  { border:'border-rose-300',    bg:'bg-rose-50/20',    badge:'bg-rose-100 text-rose-800' }
];

function openEvalModal(studentId){
  const f = state._evalForm;
  const cur = currentTerm();
  const student = studentById(studentId);
  const subj = subjectById(f.subjectId);
  if (!student || !cur) return;

  const topics = (getTopics()[f.type] || []);
  const existing = getEvals().find(e =>
    String(e.termId) === String(cur.id) && String(e.subjectId) === String(f.subjectId) &&
    String(e.studentId) === String(studentId));
  const currentScores = existing ? { ...(existing.scores || {}) } : {};

  const prevScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${prevScrollY}px`;
  document.body.style.width = '100%';

  const root = $('#modalRoot');
  const treeHTML = topics.length
    ? topics.map((t, i) => renderEvalNode(t, currentScores, 0, i + 1)).join('')
    : '<p class="py-12 text-center text-sm text-slate-400">ยังไม่มีรายการหัวข้อประเมิน</p>';

  root.innerHTML = `
  <div class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 p-2 sm:p-4 backdrop-blur-sm">
    <div class="modal-pop card flex w-full max-w-4xl flex-col overflow-hidden max-h-[92vh] sm:max-h-[88vh]">

      <div class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-100 px-4 sm:px-6 py-3.5 bg-white">
        <div>
          <h3 class="flex items-center gap-2 text-base font-bold text-slate-800">
            <i class="fa-solid fa-clipboard-check text-emerald-600"></i> ประเมินสมรรถนะสำคัญของผู้เรียน
          </h3>
          <p class="mt-0.5 text-xs text-slate-500">
            เลขที่ ${esc(student.number)} · ${esc(student.name)} · ห้อง ${esc(classById(student.classId)?.name||'')} · วิชา: <b class="text-slate-700">${esc(subj?.name||'')}</b>
          </p>
        </div>
        <button type="button" data-eval-close class="grid h-8 w-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

            <!-- ⚠️ Required Note -->
      <div class="flex shrink-0 items-center gap-1.5 border-b border-amber-100 bg-amber-50 px-4 sm:px-6 py-1.5 text-[11px] text-amber-800">
        <i class="fa-solid fa-circle-exclamation text-amber-500"></i>
        <span><b class="text-red-600">*</b> จำเป็นต้องประเมินให้ครบทุกข้อก่อนบันทึก</span>
      </div>

      <!-- Live Summary Bar (Fixed) -->
      <div class="flex shrink-0 flex-wrap items-center justify-between gap-3 border-b border-slate-100 bg-slate-50/80 px-4 sm:px-6 py-2.5">
        <div class="flex items-center gap-3">
          <span class="text-xs font-semibold text-slate-500">คะแนนเฉลี่ยรวม:</span>
          <span id="liveAvg" class="text-2xl font-bold text-slate-400 font-mono">0.00</span>
          <span id="liveBadge"></span>
        </div>
        <div class="flex items-center gap-2">
          <span id="liveProgress" class="badge bg-amber-100 text-amber-700 text-xs font-bold">
            <i class="fa-solid fa-triangle-exclamation"></i> 0/0 ข้อ
          </span>
          <div class="hidden sm:flex items-center gap-1.5 text-xs">
            ${[3,2,1,0].map(q => `<span class="badge ${LEVEL_INFO[q].cls}">${q}=${LEVEL_INFO[q].short}</span>`).join('')}
          </div>
        </div>
      </div>

      <div id="evalTree" class="min-h-0 flex-1 space-y-3 overflow-y-auto overscroll-contain p-3 sm:p-5" style="-webkit-overflow-scrolling: touch;">
        ${treeHTML}
      </div>

      <div class="flex shrink-0 items-center justify-between border-t border-slate-100 bg-slate-50/80 px-4 sm:px-6 py-3">
        <button type="button" data-eval-close class="btn btn-ghost px-4 py-2 text-sm">ยกเลิก</button>
        <button type="button" id="btnSaveEval" class="btn btn-primary px-5 py-2 text-sm">
          <i class="fa-solid fa-floppy-disk"></i> บันทึกผลการประเมิน
        </button>
      </div>
    </div>
  </div>`;

  const close = () => {
    root.innerHTML = '';
    const top = document.body.style.top;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, parseInt(top || '0') * -1);
  };

  $$('[data-eval-close]', root).forEach(b => b.addEventListener('click', close));

    // ฟังก์ชันอัปเดตคะแนนสดทุกระดับแบบ Hierarchical Rollup
  const updateSummary = () => {
    const res = computeFromTopics(currentScores, topics);
    const avgEl = $('#liveAvg', root);
    const badgeEl = $('#liveBadge', root);
    const progEl = $('#liveProgress', root);
    const saveBtn = $('#btnSaveEval', root);

    if (avgEl) {
      avgEl.textContent = fmt(res.avg);
      avgEl.style.color = LEVEL_INFO[res.level].hex;
    }
    if (badgeEl) {
      badgeEl.innerHTML = `<span class="badge ${LEVEL_INFO[res.level].cls}">${LEVEL_INFO[res.level].label}</span>`;
    }

    const isComplete = res.totalLeaves > 0 && res.evaluatedLeaves === res.totalLeaves;

    // ✅ อัปเดต Progress Badge
    if (progEl) {
      if (res.totalLeaves === 0) {
        progEl.className = 'badge bg-slate-100 text-slate-500 text-xs font-bold';
        progEl.innerHTML = `<i class="fa-solid fa-circle-info"></i> ไม่มีหัวข้อประเมิน`;
      } else if (isComplete) {
        progEl.className = 'badge bg-green-100 text-green-700 text-xs font-bold';
        progEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> ครบ ${res.evaluatedLeaves}/${res.totalLeaves} ข้อ`;
      } else {
        progEl.className = 'badge bg-amber-100 text-amber-700 text-xs font-bold';
        progEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${res.evaluatedLeaves}/${res.totalLeaves} ข้อ (ยังไม่ครบ)`;
      }
    }

    // ✅ ปุ่มบันทึกแสดงสถานะ
    if (saveBtn) {
      if (res.totalLeaves > 0 && !isComplete) {
        saveBtn.classList.add('opacity-70');
        saveBtn.title = 'กรุณาประเมินให้ครบทุกข้อก่อนบันทึก';
      } else {
        saveBtn.classList.remove('opacity-70');
        saveBtn.title = '';
      }
    }

    // อัปเดตคะแนนเฉลี่ยสด (Live Avg) และความคืบหน้าของทุกระดับชั้นใน DOM
    $$('[data-eval-node]', root).forEach(box => {
      const nid = box.dataset.evalNode;
      const nRes = res.nodeMap[nid];
      const avgTag = box.querySelector(`[data-live-node-avg="${nid}"]`);
      const progTag = box.querySelector(`[data-live-node-prog="${nid}"]`);

      if (avgTag) {
        if (nRes && nRes.avg !== null) {
          const lv = levelFromAvg(nRes.avg);
          avgTag.textContent = `เฉลี่ย ${fmt(nRes.avg)}`;
          avgTag.className = `badge font-mono font-bold text-xs ${LEVEL_INFO[lv].cls}`;
        } else {
          avgTag.textContent = 'รอคะแนน';
          avgTag.className = 'badge font-mono text-xs bg-slate-100 text-slate-400';
        }
      }

      if (progTag && nRes) {
        progTag.textContent = `${nRes.evaluatedLeaves}/${nRes.totalLeaves}`;
        progTag.className = 'badge text-xs ' + (nRes.evaluatedLeaves === 0 ? 'bg-slate-100 text-slate-500'
                          : nRes.evaluatedLeaves === nRes.totalLeaves ? 'bg-green-100 text-green-700'
                          : 'bg-amber-100 text-amber-700');
      }
    });
  };

  const evalTree = $('#evalTree', root);
  evalTree.addEventListener('click', e => {
    const btn = e.target.closest('.eval-choice-btn');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const nodeId = btn.dataset.nid;
    const val = Number(btn.dataset.val);
    currentScores[nodeId] = val;

    const parentRow = btn.closest('[data-choice-row]');
    if (parentRow) {
      parentRow.classList.add('bg-green-50/50', 'border-green-300');
      parentRow.classList.remove('bg-white', 'border-slate-100');

      const siblings = parentRow.querySelectorAll('.eval-choice-btn');
      siblings.forEach(s => {
        const sVal = Number(s.dataset.val);
        if (sVal === val) {
          s.className = `eval-choice-btn h-8 w-8 rounded-lg text-xs font-bold border transition ${LEVEL_INFO[val].btnCls}`;
        } else {
          s.className = 'eval-choice-btn h-8 w-8 rounded-lg text-xs font-semibold border border-slate-200 bg-white text-slate-500 hover:bg-slate-100';
        }
      });
    }

    updateSummary();
  });

  updateSummary();

    // บันทึกผลการประเมิน
  $('#btnSaveEval', root).addEventListener('click', async () => {
    const saveBtn = $('#btnSaveEval', root);
    const res = computeFromTopics(currentScores, topics);

    // ✅ ตรวจสอบว่ามีหัวข้อประเมินหรือไม่
    if (res.totalLeaves === 0) {
      Swal.fire({
        icon: 'error',
        title: 'ไม่พบหัวข้อประเมิน',
        text: 'กรุณาให้ผู้ดูแลระบบตั้งค่าหัวข้อประเมินก่อน',
        confirmButtonColor: '#ef4444'
      });
      return;
    }

    // ✅ ตรวจสอบว่าประเมินครบทุกข้อหรือไม่
    if (res.evaluatedLeaves < res.totalLeaves) {
      const missing = [];
      const collect = (node, prefix) => {
        const kids = node.children || [];
        if (!kids.length) {
          const v = currentScores[node.id];
          if (v === undefined || v === null || v === '' || isNaN(Number(v))) {
            missing.push(prefix + ' ' + node.name);
          }
          return;
        }
        kids.forEach((c, i) => collect(c, prefix + (prefix ? '.' : '') + (i + 1)));
      };
      topics.forEach((t, i) => collect(t, String(i + 1)));

      const listHTML = missing.slice(0, 15).map((name, i) =>
        `<li class="text-left text-xs py-1 border-b border-slate-100 last:border-0">
          <b class="text-rose-600">${i + 1}.</b> ${esc(name)}
        </li>`
      ).join('');

      Swal.fire({
        icon: 'warning',
        title: 'ประเมินไม่ครบทุกข้อ',
        html: `
          <p class="text-sm text-slate-600 mb-2">
            จำเป็นต้องประเมินให้ครบทุกข้อก่อนบันทึก
            (ยังขาดอีก <b class="text-red-600">${missing.length}</b> ข้อ)
          </p>
          <div class="max-h-56 overflow-y-auto rounded-lg border border-slate-200 bg-slate-50 px-3 py-1">
            <ul class="list-none">${listHTML}
              ${missing.length > 15 ? `<li class="text-center text-xs text-slate-400 py-1">... และอีก ${missing.length - 15} ข้อ</li>` : ''}
            </ul>
          </div>
        `,
        confirmButtonText: '<i class="fa-solid fa-check"></i> รับทราบ',
        confirmButtonColor: '#ef4444'
      });
      return;
    }

    const origHTML = saveBtn.innerHTML;
    saveBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> กำลังบันทึก...';
    saveBtn.disabled = true;

    try {
      const evs = getEvals();
      const idx = evs.findIndex(e =>
        String(e.termId) === String(cur.id) &&
        String(e.subjectId) === String(f.subjectId) &&
        String(e.studentId) === String(studentId)
      );

      const curTeacher = state.user || getUsers().find(u => u.role === 'teacher') || getUsers()[0] || { id: 'u_admin' };

      const payload = {
        id: idx >= 0 ? evs[idx].id : uid(),
        termId: cur.id,
        subjectId: f.subjectId,
        classId: f.classId,
        studentId,
        teacherId: curTeacher.id,
        type: f.type,
        scores: currentScores,
        avg: Number(fmt(res.avg)),
        level: res.level,
        updatedAt: new Date().toISOString()
      };

      if (idx >= 0) evs[idx] = payload;
      else evs.push(payload);

      DB.set('evaluations', evs);

      if (API.isConnected()) {
        try {
          const cloudRes = await API.request('saveEvaluation', { data: payload });
          if (cloudRes && cloudRes.status === 'success' && Array.isArray(cloudRes.data)) {
            DB.set('evaluations', cloudRes.data);
          }
        } catch (apiErr) {
          console.warn('บันทึกขึ้น Google Sheets ไม่สำเร็จในขณะนี้:', apiErr);
          toast('warning', 'บันทึกลงระบบในเครื่องแล้ว (รอส่งขึ้น Google Sheets)');
        }
      }

      close();
      toast('success', 'บันทึกผลการประเมินเรียบร้อยแล้ว');
      render();
    } catch (err) {
      console.error('Error saving eval:', err);
      saveBtn.disabled = false;
      saveBtn.innerHTML = origHTML;
      Swal.fire({
        icon: 'error',
        title: 'เกิดข้อผิดพลาดในการบันทึก',
        text: err.message || String(err),
        confirmButtonColor: '#ef4444'
      });
    }
  });
}

function renderEvalNode(node, scores, depth, prefix){
  const kids = node.children || [];
  if (!kids.length){
    const v = scores[node.id];
    return `
    <div data-choice-row class="flex flex-col gap-2 rounded-xl border p-2.5 sm:flex-row sm:items-center sm:justify-between transition ${v!==undefined?'border-green-300 bg-green-50/50':'border-slate-100 bg-white'}"
         style="margin-left:${Math.min(depth,4)*6}px">
      <div class="flex-1">
        <p class="text-[13px] leading-snug text-slate-700">
          <span class="font-bold text-slate-400 mr-1 text-xs">${prefix}</span>
          ${esc(node.name)}
        </p>
      </div>
      <div class="flex shrink-0 gap-1.5 self-end sm:self-auto">
        ${[3,2,1,0].map(n => {
          const isSelected = (v === n);
          const btnClass = isSelected
            ? LEVEL_INFO[n].btnCls
            : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100';
          return `
            <button type="button" class="eval-choice-btn h-8 w-8 rounded-lg text-xs font-bold border transition ${btnClass}"
                    data-nid="${node.id}" data-val="${n}">
              ${n}
            </button>`;
        }).join('')}
      </div>
    </div>`;
  }

  const lvl = Math.min(depth, 4);
  const style = EVAL_LEVEL_STYLES[lvl];
  const label = TOPIC_LEVEL_LABELS[lvl] || 'หัวข้อ';

  return `
  <div data-eval-node="${node.id}" class="rounded-2xl border ${style.border} ${style.bg} p-3 shadow-2xs mb-3"
       style="margin-left:${Math.min(depth,3)*6}px">
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/60 pb-2">
      <div class="flex items-center gap-2">
        <span class="badge ${style.badge} font-bold text-[10px]">
          ${label}
        </span>
        <p class="text-sm font-bold text-slate-800">
          <span class="mr-1" style="color:var(--c-primary)">${prefix}.</span>${esc(node.name)}
        </p>
      </div>
      <div class="flex items-center gap-2">
        <span data-live-node-avg="${node.id}" class="badge font-mono text-xs bg-slate-100 text-slate-400">รอคะแนน</span>
        <span data-live-node-prog="${node.id}" class="badge bg-slate-100 text-slate-500 text-xs">0/0</span>
      </div>
    </div>
    <div class="mt-2.5 space-y-2">
      ${kids.map((c, i) => renderEvalNode(c, scores, depth + 1, `${prefix}.${i + 1}`)).join('')}
    </div>
  </div>`;
}

/* ============================================================
   10. MOUNT EVENT HANDLERS (เชื่อมต่อระบบทุกปุ่ม 100% พร้อม Event Delegation)
============================================================ */
function mountView(){
  // Mobile Nav
  const mn = $('#btnMenu');
  if (mn) mn.addEventListener('click', () => $('#mobileNav')?.classList.toggle('hidden'));

  $$('[data-nav]').forEach(b => b.addEventListener('click', () => {
    $('#mobileNav')?.classList.add('hidden');
    setView(b.dataset.nav);
  }));

  const bl = $('#btnLogin'); if (bl) bl.addEventListener('click', openLogin);
  const bl2 = $('#btnLogin2'); if (bl2) bl2.addEventListener('click', openLogin);
  const lo = $('#btnLogout'); if (lo) lo.addEventListener('click', doLogout);

  // Dashboard Filters
  const dt = $('#dashTerm');
  if (dt) {
    dt.addEventListener('change', e => {
      state.dashTerm = e.target.value;
      const tId = state.view === 't-dashboard' && state.user?.role === 'teacher' ? state.user.id : null;
      renderDashboardBody(tId);
    });
  }
  const ds = $('#dashSubject');
  if (ds) {
    ds.addEventListener('change', () => {
      const tId = state.view === 't-dashboard' && state.user?.role === 'teacher' ? state.user.id : null;
      renderDashboardBody(tId);
    });
  }
  const dc = $('#dashClass');
  if (dc) {
    dc.addEventListener('change', () => {
      const tId = state.view === 't-dashboard' && state.user?.role === 'teacher' ? state.user.id : null;
      renderDashboardBody(tId);
    });
  }
  if (state.view === 'dashboard' || state.view === 'a-dashboard' || state.view === 't-dashboard') {
    const tId = state.view === 't-dashboard' && state.user?.role === 'teacher' ? state.user.id : null;
    setTimeout(() => renderDashboardBody(tId), 50);
  }

  // 1. Users Management
  const au = $('#addUser');
  if (au) au.addEventListener('click', () => {
    openModal({
      title:'เพิ่มผู้ใช้งาน', icon:'fa-user-plus',
      body: userFormHTML(null), submitText:'เพิ่มผู้ใช้งาน',
      onSubmit: async fd => {
        const users = getUsers();
        if (users.some(u => u.username === fd.get('username').trim())) { toast('error','ชื่อผู้ใช้นี้ถูกใช้แล้ว'); return false; }
        const newUser = {
          id:uid(), username:fd.get('username').trim(), password:fd.get('password'),
          fullname:fd.get('fullname').trim(), role:fd.get('role'),
          position: (fd.get('position')||'').trim()
        };
        users.push(newUser);
        DB.set('users', users);
        if (API.isConnected()) API.request('saveUser', { data: newUser });
        toast('success','เพิ่มผู้ใช้งานสำเร็จ'); render();
      }
    });
  });

  $$('[data-edit-user]').forEach(b => b.addEventListener('click', () => {
    const u = getUsers().find(x => String(x.id) === String(b.dataset.editUser)); if (!u) return;
    openModal({
      title:'แก้ไขผู้ใช้งาน', icon:'fa-user-pen',
      body: userFormHTML(u), submitText:'บันทึกการแก้ไข',
      onSubmit: async fd => {
        const users = getUsers();
        const uname = fd.get('username').trim();
        if (users.some(x => x.username === uname && String(x.id) !== String(u.id))) { toast('error','ชื่อผู้ใช้นี้ถูกใช้แล้ว'); return false; }
        const idx = users.findIndex(x => String(x.id) === String(u.id));
        users[idx] = { ...users[idx], username:uname, password:fd.get('password'),
          fullname:fd.get('fullname').trim(), role:fd.get('role'),
          position: (fd.get('position')||'').trim() };
        DB.set('users', users);
        if (state.user && String(state.user.id) === String(u.id)) { state.user = users[idx]; DB.set('session', users[idx].id); }
        if (API.isConnected()) API.request('saveUser', { data: users[idx] });
        toast('success','บันทึกการแก้ไขสำเร็จ'); render();
      }
    });
  }));

  $$('[data-del-user]').forEach(b => b.addEventListener('click', async () => {
    const u = getUsers().find(x => String(x.id) === String(b.dataset.delUser)); if (!u) return;
    if (u.username === 'admin') { toast('error','ไม่สามารถลบผู้ดูแลระบบหลักได้'); return; }
    if (!await confirmDelete(`ต้องการลบผู้ใช้ "${u.fullname}" หรือไม่?`)) return;
    DB.set('users', getUsers().filter(x => String(x.id) !== String(u.id)));
    if (API.isConnected()) API.request('deleteUser', { id: u.id });
    toast('success','ลบผู้ใช้งานสำเร็จ'); render();
  }));

  // 2. Terms Management (เพิ่ม ลบ แก้ไข ได้ทันที)
  const at = $('#addTerm');
  if (at) at.addEventListener('click', () => {
    const y = new Date().getFullYear() + 543;
    openModal({
      title:'เพิ่มภาคเรียน / ปีการศึกษา', icon:'fa-calendar-plus',
      body:`<div class="grid gap-4 sm:grid-cols-2">
        <div><label class="label">ปีการศึกษา (พ.ศ.) *</label><input type="number" name="year" class="input" required value="${y}"></div>
        <div><label class="label">ภาคเรียนที่ *</label>
          <select name="term" class="select" required><option value="1">1</option><option value="2">2</option></select></div>
      </div>
      <label class="mt-2 inline-flex items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" name="cur" class="h-4 w-4 rounded accent-green-600"> ตั้งเป็นภาคเรียนปัจจุบัน</label>`,
      submitText:'เพิ่มภาคเรียน',
      onSubmit: async fd => {
        const terms = getTerms();
        const year = num(fd.get('year')), term = num(fd.get('term'));
        const isCur = !!fd.get('cur');
        if (isCur) terms.forEach(t => t.isCurrent = false);
        const newTerm = { id:uid(), year, term, isCurrent: isCur };
        terms.push(newTerm);
        DB.set('terms', terms);
        if (API.isConnected()) API.request('saveTerm', { data: newTerm });
        toast('success','เพิ่มภาคเรียนสำเร็จ'); render();
      }
    });
  });

  // 2. Terms Management Event Delegation
  const termsCard = $('#termsCard');
  if (termsCard) {
    termsCard.addEventListener('click', async e => {
      const editBtn = e.target.closest('[data-edit-term]');
      if (editBtn) {
        const t = getTerms().find(x => String(x.id) === String(editBtn.dataset.editTerm));
        if (!t) return;
        openModal({
          title:'แก้ไขภาคเรียน', icon:'fa-calendar-days',
          body:`<div class="grid gap-4 sm:grid-cols-2">
            <div><label class="label">ปีการศึกษา (พ.ศ.) *</label><input type="number" name="year" class="input" required value="${t.year}"></div>
            <div><label class="label">ภาคเรียนที่ *</label>
              <select name="term" class="select" required>
                <option value="1" ${t.term===1?'selected':''}>1</option>
                <option value="2" ${t.term===2?'selected':''}>2</option>
              </select></div>
          </div>
          <label class="mt-2 inline-flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" name="cur" ${t.isCurrent?'checked':''} class="h-4 w-4 rounded accent-green-600"> ตั้งเป็นภาคเรียนปัจจุบัน</label>`,
          submitText:'บันทึก',
          onSubmit: async fd => {
            const terms = getTerms();
            const year = num(fd.get('year')), term = num(fd.get('term'));
            const isCur = !!fd.get('cur');
            if (isCur) terms.forEach(x => x.isCurrent = false);
            const i = terms.findIndex(x => String(x.id) === String(t.id));
            terms[i] = { ...terms[i], year, term, isCurrent: isCur };
            DB.set('terms', terms);
            if (API.isConnected()) API.request('saveTerm', { data: terms[i] });
            toast('success','บันทึกสำเร็จ'); render();
          }
        });
        return;
      }

      const delBtn = e.target.closest('[data-del-term]');
      if (delBtn) {
        const tid = delBtn.dataset.delTerm;
        const t = getTerms().find(x => String(x.id) === String(tid));
        if (!t) return;
        if (!await confirmDelete(`ยืนยันการลบ ${termLabel(t)} ?`)) return;

        const remaining = getTerms().filter(x => String(x.id) !== String(t.id));
        if (t.isCurrent && remaining.length > 0) {
          remaining[0].isCurrent = true;
          if (API.isConnected()) API.request('saveTerm', { data: remaining[0] });
        }
        DB.set('terms', remaining);

        // ลบผลการประเมินที่อยู่ในภาคเรียนนี้ด้วย
        const evs = getEvals().filter(ev => String(ev.termId) !== String(t.id));
        DB.set('evaluations', evs);

        if (API.isConnected()) API.request('deleteTerm', { id: t.id });
        toast('success','ลบภาคเรียนสำเร็จ'); render();
        return;
      }

      const curBtn = e.target.closest('[data-set-current]');
      if (curBtn) {
        const cid = curBtn.dataset.setCurrent;
        const terms = getTerms();
        terms.forEach(t => t.isCurrent = (String(t.id) === String(cid)));
        DB.set('terms', terms);
        const cur = terms.find(t => t.isCurrent);
        if (API.isConnected() && cur) API.request('saveTerm', { data: cur });
        toast('success','ตั้งเป็นภาคเรียนปัจจุบันแล้ว'); render();
        return;
      }
    });
  }

  // 3. Subjects & Groups Management (แก้ไขการลบข้อมูลได้ 100%)
  const ag = $('#addGroup');
  if (ag) ag.addEventListener('click', () => openModal({
    title:'เพิ่มกลุ่มสาระการเรียนรู้', icon:'fa-folder-plus',
    body:`<div><label class="label">ชื่อกลุ่มสาระ *</label><input name="name" class="input" required placeholder="เช่น วิทยาศาสตร์และเทคโนโลยี"></div>`,
    submitText:'เพิ่มกลุ่มสาระ',
    onSubmit: async fd => {
      const groups = getGroups();
      const name = fd.get('name').trim();
      if (groups.some(g => g.name === name)) { toast('error','มีกลุ่มสาระนี้อยู่แล้ว'); return false; }
      const newG = { id:uid(), name };
      groups.push(newG);
      DB.set('subjectGroups', groups);
      if (API.isConnected()) API.request('saveSubjectGroup', { data: newG });
      toast('success','เพิ่มกลุ่มสาระสำเร็จ'); render();
    }
  }));

  const groupListContainer = $('#groupList');
  if (groupListContainer) {
    groupListContainer.addEventListener('click', async e => {
      const editBtn = e.target.closest('[data-edit-group]');
      if (editBtn) {
        const g = getGroups().find(x => String(x.id) === String(editBtn.dataset.editGroup));
        if (!g) return;
        openModal({
          title:'แก้ไขกลุ่มสาระ', icon:'fa-folder-open',
          body:`<div><label class="label">ชื่อกลุ่มสาระ *</label><input name="name" class="input" required value="${esc(g.name)}"></div>`,
          submitText:'บันทึก',
          onSubmit: async fd => {
            const groups = getGroups();
            const i = groups.findIndex(x => String(x.id) === String(g.id));
            groups[i].name = fd.get('name').trim();
            DB.set('subjectGroups', groups);
            if (API.isConnected()) API.request('saveSubjectGroup', { data: groups[i] });
            toast('success','บันทึกสำเร็จ'); render();
          }
        });
        return;
      }

      const delBtn = e.target.closest('[data-del-group]');
      if (delBtn) {
        const g = getGroups().find(x => String(x.id) === String(delBtn.dataset.delGroup));
        if (!g) return;
        if (!await confirmDelete(`ยืนยันการลบกลุ่มสาระ "${g.name}" และรายวิชาทั้งหมดที่อยู่ในกลุ่มนี้?`)) return;

        const subjsToDelete = getSubjects().filter(s => String(s.groupId) === String(g.id));
        const subjIdsToDelete = new Set(subjsToDelete.map(s => String(s.id)));

        DB.set('subjectGroups', getGroups().filter(x => String(x.id) !== String(g.id)));
        DB.set('subjects', getSubjects().filter(s => !subjIdsToDelete.has(String(s.id))));
        DB.set('evaluations', getEvals().filter(ev => !subjIdsToDelete.has(String(ev.subjectId))));

        if (API.isConnected()) API.request('deleteSubjectGroup', { id: g.id });
        toast('success','ลบกลุ่มสาระและรายวิชาสำเร็จ'); render();
        return;
      }
    });
  }

  const as = $('#addSubject');
  if (as) as.addEventListener('click', () => {
    const groups = getGroups();
    if (!groups.length) { toast('error','กรุณาเพิ่มกลุ่มสาระก่อน'); return; }
    openModal({
      title:'เพิ่มรายวิชา', icon:'fa-book-medical',
      body:`<div><label class="label">กลุ่มสาระการเรียนรู้ *</label>
        <select name="groupId" class="select" required>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>
      <div><label class="label">ชื่อรายวิชา *</label><input name="name" class="input" required placeholder="เช่น ภาษาไทยพื้นฐาน"></div>`,
      submitText:'เพิ่มรายวิชา',
      onSubmit: async fd => {
        const subs = getSubjects();
        const newSub = { id:uid(), groupId:fd.get('groupId'), name:fd.get('name').trim() };
        subs.push(newSub);
        DB.set('subjects', subs);
        if (API.isConnected()) API.request('saveSubject', { data: newSub });
        toast('success','เพิ่มรายวิชาสำเร็จ'); render();
      }
    });
  });

  // Event Delegation สำหรับการแก้ไขและลบรายวิชาใน #subjList
  const subjListContainer = $('#subjList');
  if (subjListContainer) {
    subjListContainer.addEventListener('click', async e => {
      const editBtn = e.target.closest('[data-edit-subject]');
      if (editBtn) {
        const s = getSubjects().find(x => String(x.id) === String(editBtn.dataset.editSubject));
        if (!s) return;
        openModal({
          title:'แก้ไขรายวิชา', icon:'fa-book',
          body:`<div><label class="label">กลุ่มสาระการเรียนรู้ *</label>
            <select name="groupId" class="select" required>${getGroups().map(g=>`<option value="${g.id}" ${String(g.id)===String(s.groupId)?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
          <div><label class="label">ชื่อรายวิชา *</label><input name="name" class="input" required value="${esc(s.name)}"></div>`,
          submitText:'บันทึก',
          onSubmit: async fd => {
            const subs = getSubjects();
            const i = subs.findIndex(x => String(x.id) === String(s.id));
            subs[i] = { ...subs[i], groupId:fd.get('groupId'), name:fd.get('name').trim() };
            DB.set('subjects', subs);
            if (API.isConnected()) API.request('saveSubject', { data: subs[i] });
            toast('success','บันทึกสำเร็จ'); render();
          }
        });
        return;
      }

      const delBtn = e.target.closest('[data-del-subject]');
      if (delBtn) {
        const s = getSubjects().find(x => String(x.id) === String(delBtn.dataset.delSubject));
        if (!s) return;
        if (!await confirmDelete(`ยืนยันการลบรายวิชา "${s.name}" ?`)) return;
        DB.set('subjects', getSubjects().filter(x => String(x.id) !== String(s.id)));
        DB.set('evaluations', getEvals().filter(ev => String(ev.subjectId) !== String(s.id)));
        if (API.isConnected()) API.request('deleteSubject', { id: s.id });
        toast('success','ลบรายวิชาสำเร็จ'); render();
        return;
      }
    });
  }

  const ss = $('#subjSearch');
  if (ss) { ss.addEventListener('input', renderSubjectList); renderSubjectList(); }

  // 4. Classes Management (เพิ่ม ลบ แก้ไข ได้ทันที)
  $$('[data-clstab]').forEach(b => b.addEventListener('click', () => { state._clsTab = b.dataset.clstab; render(); }));

  const ac = $('#addClass');
  if (ac) ac.addEventListener('click', () => {
    openModal({
      title:'เพิ่มชั้นเรียน', icon:'fa-door-open',
      body:`<div><label class="label">ระดับชั้น *</label>
          <select name="level" class="select" required>${BIG_LEVELS.map(l=>`<option value="${l}">${l}</option>`).join('')}</select></div>
        <div><label class="label">ชื่อห้องเรียน *</label><input name="name" class="input" required placeholder="เช่น ม.1/1"></div>`,
      submitText:'เพิ่มชั้นเรียน',
      onSubmit: async fd => {
        const classes = getClasses();
        const name = fd.get('name').trim();
        if (classes.some(c => c.name === name)) { toast('error','มีห้องเรียนนี้อยู่แล้ว'); return false; }
        const newClass = { id:uid(), name, level:fd.get('level') };
        classes.push(newClass);
        DB.set('classes', classes);
        state._stdClass = newClass.id;
        if (API.isConnected()) API.request('saveClass', { data: newClass });
        toast('success','เพิ่มชั้นเรียนสำเร็จ'); render();
      }
    });
  });

  // Event delegation สำหรับชั้นเรียนและนักเรียนบน #clsBody
  const clsBody = $('#clsBody');
  if (clsBody) {
    clsBody.addEventListener('click', async e => {
      // 1. แก้ไขชั้นเรียน
      const editClassBtn = e.target.closest('[data-edit-class]');
      if (editClassBtn) {
        const c = getClasses().find(x => String(x.id) === String(editClassBtn.dataset.editClass));
        if (!c) return;
        openModal({
          title:'แก้ไขชั้นเรียน', icon:'fa-door-open',
          body:`<div><label class="label">ระดับชั้น *</label>
            <select name="level" class="select" required>${BIG_LEVELS.map(l=>`<option value="${l}" ${l===c.level?'selected':''}>${l}</option>`).join('')}</select></div>
          <div><label class="label">ชื่อห้องเรียน *</label><input name="name" class="input" required value="${esc(c.name)}"></div>`,
          submitText:'บันทึก',
          onSubmit: async fd => {
            const classes = getClasses();
            const i = classes.findIndex(x => String(x.id) === String(c.id));
            classes[i] = { ...classes[i], name:fd.get('name').trim(), level:fd.get('level') };
            DB.set('classes', classes);
            if (API.isConnected()) API.request('saveClass', { data: classes[i] });
            toast('success','บันทึกสำเร็จ'); render();
          }
        });
        return;
      }

      // 2. ลบชั้นเรียน
      const delClassBtn = e.target.closest('[data-del-class]');
      if (delClassBtn) {
        const c = getClasses().find(x => String(x.id) === String(delClassBtn.dataset.delClass));
        if (!c) return;
        const cnt = getStudents().filter(s => String(s.classId) === String(c.id)).length;
        if (!await confirmDelete(`ต้องการลบห้อง "${c.name}" หรือไม่? (นักเรียน ${cnt} คนในห้องนี้จะถูกลบไปด้วย)`)) return;

        DB.set('classes', getClasses().filter(x => String(x.id) !== String(c.id)));
        DB.set('students', getStudents().filter(s => String(s.classId) !== String(c.id)));
        DB.set('evaluations', getEvals().filter(ev => String(ev.classId) !== String(c.id)));
        if (String(state._stdClass) === String(c.id)) {
          state._stdClass = getClasses()[0]?.id || '';
        }

        if (API.isConnected()) API.request('deleteClass', { id: c.id });
        toast('success','ลบชั้นเรียนสำเร็จ'); render();
        return;
      }

      // 3. แก้ไขข้อมูลนักเรียน
      const editStdBtn = e.target.closest('[data-edit-std]');
      if (editStdBtn) {
        const s = getStudents().find(x => String(x.id) === String(editStdBtn.dataset.editStd));
        if (!s) return;
        openModal({
          title:'แก้ไขข้อมูลนักเรียน', icon:'fa-user-pen',
          body:`<div><label class="label">ห้องเรียน *</label>
            <select name="classId" class="select" required>${getClasses().map(c=>`<option value="${c.id}" ${String(c.id)===String(s.classId)?'selected':''}>${esc(c.name)} (${esc(c.level)})</option>`).join('')}</select></div>
          <div class="grid gap-4 sm:grid-cols-3">
            <div><label class="label">เลขที่ *</label><input name="number" class="input" required value="${esc(s.number)}"></div>
            <div class="sm:col-span-2"><label class="label">ชื่อ - นามสกุล *</label><input name="name" class="input" required value="${esc(s.name)}"></div>
          </div>`,
          submitText:'บันทึก',
          onSubmit: async fd => {
            const students = getStudents();
            const i = students.findIndex(x => String(x.id) === String(s.id));
            students[i] = { ...students[i], classId:fd.get('classId'), number:fd.get('number').trim(), name:fd.get('name').trim() };
            DB.set('students', students);
            if (API.isConnected()) API.request('saveStudent', { data: students[i] });
            toast('success','บันทึกสำเร็จ'); render();
          }
        });
        return;
      }

      // 4. ลบข้อมูลนักเรียน
      const delStdBtn = e.target.closest('[data-del-std]');
      if (delStdBtn) {
        const s = getStudents().find(x => String(x.id) === String(delStdBtn.dataset.delStd));
        if (!s) return;
        if (!await confirmDelete(`ยืนยันการลบนักเรียน "${s.name}" ?`)) return;
        DB.set('students', getStudents().filter(x => String(x.id) !== String(s.id)));
        DB.set('evaluations', getEvals().filter(ev => String(ev.studentId) !== String(s.id)));
        if (API.isConnected()) API.request('deleteStudent', { id: s.id });
        toast('success','ลบนักเรียนสำเร็จ'); render();
        return;
      }
    });
  }

  // 5. Students Management (เพิ่ม ลบ แก้ไข ได้ทันที)
  const sc = $('#stdClassSel');
  if (sc) sc.addEventListener('change', e => { state._stdClass = e.target.value; render(); });

  const ast = $('#addStudent');
  if (ast) ast.addEventListener('click', () => {
    const classes = getClasses();
    if (!classes.length) { toast('error','กรุณาเพิ่มชั้นเรียนก่อน'); return; }
    openModal({
      title:'เพิ่มนักเรียน', icon:'fa-user-plus',
      body:`<div><label class="label">ห้องเรียน *</label>
        <select name="classId" class="select" required>${classes.map(c=>`<option value="${c.id}" ${String(c.id)===String(state._stdClass)?'selected':''}>${esc(c.name)} (${esc(c.level)})</option>`).join('')}</select></div>
      <div class="grid gap-4 sm:grid-cols-3">
        <div><label class="label">เลขที่ *</label><input name="number" class="input" required placeholder="1"></div>
        <div class="sm:col-span-2"><label class="label">ชื่อ - นามสกุล *</label><input name="name" class="input" required placeholder="เช่น เด็กชายสมชาย ใจดี"></div>
      </div>`,
      submitText:'เพิ่มนักเรียน',
      onSubmit: async fd => {
        const students = getStudents();
        const cid = fd.get('classId');
        const newSt = { id:uid(), classId:cid, number:fd.get('number').trim(), name:fd.get('name').trim() };
        students.push(newSt);
        DB.set('students', students);
        state._stdClass = cid;
        if (API.isConnected()) API.request('saveStudent', { data: newSt });
        toast('success','เพิ่มนักเรียนสำเร็จ'); render();
      }
    });
  });

  const ie = $('#importExcel');
  if (ie) ie.addEventListener('click', () => {
    const classes = getClasses();
    if (!classes.length) { toast('error','กรุณาเพิ่มชั้นเรียนก่อน'); return; }
    openModal({
      title:'นำเข้ารายชื่อจาก Excel / CSV', icon:'fa-file-excel', size:'max-w-xl',
      body:`
        <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs text-emerald-800">
          <p class="font-semibold"><i class="fa-solid fa-circle-info mr-1"></i>รูปแบบไฟล์ Excel / CSV</p>
          <p class="mt-1">คอลัมน์ A = เลขที่, คอลัมน์ B = ชื่อ - นามสกุล (รองรับ .xlsx, .xls, .csv)</p>
        </div>
        <div><label class="label">ห้องเรียนปลายทาง *</label>
          <select name="classId" class="select" required>${classes.map(c=>`<option value="${c.id}" ${String(c.id)===String(state._stdClass)?'selected':''}>${esc(c.name)} (${esc(c.level)})</option>`).join('')}</select></div>
        <div><label class="label">เลือกไฟล์ Excel *</label>
          <input type="file" name="file" id="xlsFile" class="input" accept=".xlsx,.xls,.csv" required></div>`,
      submitText:'เริ่มนำเข้าข้อมูล',
      onSubmit: (fd, close) => new Promise(resolve => {
        const file = fd.get('file');
        if (!file || !file.size) { toast('error','กรุณาเลือกไฟล์'); return resolve(false); }
        const reader = new FileReader();
        reader.onload = async ev => {
          try {
            const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false });
            const rows = [];
            json.forEach((r, i) => {
              if (!r || r.length < 2) return;
              let [a, b] = [r[0], r[1]];
              if (i === 0 && typeof a === 'string' && /เลขที่/i.test(a)) return;
              if (!b) { b = a; a = rows.length + 1; }
              if (!b) return;
              rows.push({ id:uid(), number:String(a).trim(), name:String(b).trim() });
            });
            if (!rows.length) { toast('error','ไม่พบข้อมูลที่ถูกต้องในไฟล์'); return resolve(false); }

            const cid = fd.get('classId');
            const students = getStudents();
            let addedCount = 0;
            const newStudentsBatch = [];

            rows.forEach(r => {
              if (!students.some(s => String(s.classId) === String(cid) && s.name === r.name)) {
                const item = { id:r.id, classId:cid, number:r.number, name:r.name };
                students.push(item);
                newStudentsBatch.push(item);
                addedCount++;
              }
            });

            DB.set('students', students);
            state._stdClass = cid;
            if (API.isConnected() && newStudentsBatch.length) {
              API.request('batchImportStudents', { classId: cid, students: newStudentsBatch });
            }

            toast('success', `นำเข้าข้อมูลสำเร็จ ${addedCount} คน`);
            render();
            resolve(true);
          } catch(err) {
            console.error(err);
            toast('error','เกิดข้อผิดพลาดในการอ่านไฟล์ Excel');
            resolve(false);
          }
        };
        reader.readAsArrayBuffer(file);
      })
    });
  });


  // 6. Topics Management (5 Levels)
  $$('[data-topictype]').forEach(b => b.addEventListener('click', () => { state._topicType = b.dataset.topictype; render(); }));

  function findNodeInTree(list, id) {
    for (const item of list) {
      if (String(item.id) === String(id)) return item;
      if (item.children && item.children.length) {
        const found = findNodeInTree(item.children, id);
        if (found) return found;
      }
    }
    return null;
  }

  function deleteNodeFromTree(list, id) {
    const idx = list.findIndex(item => String(item.id) === String(id));
    if (idx !== -1) {
      list.splice(idx, 1);
      return true;
    }
    for (const item of list) {
      if (item.children && item.children.length) {
        if (deleteNodeFromTree(item.children, id)) return true;
      }
    }
    return false;
  }

  const addTopic = $('#addTopic');
  if (addTopic) addTopic.addEventListener('click', () => {
    const type = state._topicType || 'lower';
    openModal({
      title:'เพิ่มหัวข้อใหญ่ (ระดับ 1)', icon:'fa-list-check',
      body:`<div><label class="label">ชื่อหัวข้อใหญ่ *</label>
        <input name="name" class="input" required placeholder="เช่น 1. ความสามารถในการสื่อสาร"></div>`,
      submitText:'เพิ่มหัวข้อใหญ่',
      onSubmit: async fd => {
        const t = getTopics();
        t[type].push({ id:uid(), name:fd.get('name').trim(), children:[] });
        DB.set('topics', t);
        if (API.isConnected()) API.request('saveTopics', { data: t });
        toast('success','เพิ่มหัวข้อใหญ่สำเร็จ'); render();
      }
    });
  });

  $$('[data-add-node]').forEach(b => b.addEventListener('click', () => {
    const type = state._topicType || 'lower';
    const parentId = b.dataset.addNode;
    const parentDepth = Number(b.dataset.depth || 0);
    const nextDepth = parentDepth + 1;
    const nextLabel = TOPIC_LEVEL_LABELS[nextDepth] || 'หัวข้อย่อย';

    const t = getTopics();
    const parent = findNodeInTree(t[type], parentId);
    if (!parent) return;

    openModal({
      title: `เพิ่ม${nextLabel} (ระดับ ${nextDepth + 1})`, icon:'fa-plus',
      body:`<div class="mb-2 text-xs text-slate-500">ภายใต้: <b class="text-slate-700">${esc(parent.name)}</b></div>
      <div><label class="label">ชื่อ${nextLabel} *</label>
        <textarea name="name" class="textarea" rows="3" required placeholder="กรอกรายละเอียด${nextLabel}..."></textarea></div>`,
      submitText:`เพิ่ม${nextLabel}`,
      onSubmit: async fd => {
        parent.children = parent.children || [];
        parent.children.push({ id:uid(), name:fd.get('name').trim(), children:[] });
        DB.set('topics', t);
        if (API.isConnected()) API.request('saveTopics', { data: t });
        toast('success', `เพิ่ม${nextLabel}สำเร็จ`); render();
      }
    });
  }));

  $$('[data-edit-node]').forEach(b => b.addEventListener('click', () => {
    const type = state._topicType || 'lower';
    const nodeId = b.dataset.editNode;
    const t = getTopics();
    const node = findNodeInTree(t[type], nodeId);
    if (!node) return;

    openModal({
      title:'แก้ไขหัวข้อ', icon:'fa-pen',
      body:`<div><label class="label">ชื่อหัวข้อ *</label>
        <textarea name="name" class="textarea" rows="3" required>${esc(node.name)}</textarea></div>`,
      submitText:'บันทึกการแก้ไข',
      onSubmit: async fd => {
        node.name = fd.get('name').trim();
        DB.set('topics', t);
        if (API.isConnected()) API.request('saveTopics', { data: t });
        toast('success','บันทึกการแก้ไขสำเร็จ'); render();
      }
    });
  }));

  $$('[data-del-node]').forEach(b => b.addEventListener('click', async () => {
    const type = state._topicType || 'lower';
    const nodeId = b.dataset.delNode;
    const t = getTopics();
    const node = findNodeInTree(t[type], nodeId);
    if (!node) return;

    if (!await confirmDelete(`ลบ "${node.name}" และหัวข้อย่อยทั้งหมดที่อยู่ภายใต้ข้อนี้?`)) return;
    deleteNodeFromTree(t[type], nodeId);
    DB.set('topics', t);
    if (API.isConnected()) API.request('saveTopics', { data: t });
    toast('success','ลบเรียบร้อยแล้ว'); render();
  }));

  // 7. Teacher Evaluation Form Controls
  const evS = $('#evSubject');
  if (evS) {
    evS.addEventListener('change', e => { state._evalForm.subjectId = e.target.value; renderEvalList(); });
    $('#evType').addEventListener('change', e => {
      state._evalForm.type = e.target.value;
      const classes = getClasses().filter(c => (e.target.value==='lower'?LOWER:UPPER).includes(c.level));
      state._evalForm.classId = classes[0]?.id || '';
      render();
    });
    $('#evClass').addEventListener('change', e => {
      state._evalForm.classId = e.target.value;
      renderEvalList();
    });
    renderEvalList();
  }

  // Event Delegation สำหรับปุ่มประเมินนักเรียนใน #evList
  const evListBox = $('#evList');
  if (evListBox) {
    evListBox.addEventListener('click', e => {
      const btn = e.target.closest('[data-eval]');
      if (btn) {
        openEvalModal(btn.dataset.eval);
      }
    });
  }

  // 8. Settings & Cloud Sync Handlers
  const btnSaveGas = $('#btnSaveGasUrl');
  if (btnSaveGas) {
    btnSaveGas.addEventListener('click', async () => {
      const url = $('#gasUrlInput').value.trim();
      CONFIG.setScriptUrl(url);
      if (!url) {
        toast('info', 'ยกเลิกการเชื่อมต่อ Google Sheets แล้ว');
        render();
        return;
      }
      loading('กำลังทดสอบการเชื่อมต่อ Google Sheets...');
      const ping = await API.request('ping');
      if (ping && ping.status === 'success') {
        await API.syncAllFromCloud();
        closeLoading();
        toast('success', 'เชื่อมต่อ Google Sheets และซิงค์ข้อมูลสำเร็จ!');
        render();
      } else {
        closeLoading();
        Swal.fire({
          icon:'error',
          title:'เชื่อมต่อไม่สำเร็จ',
          text:'โปรดตรวจสอบว่าได้เลือกสิทธิ์ "Anyone" (ทุกคน) ตอนทำการ Deploy Web App หรือไม่',
          confirmButtonColor: getSettings().primary || '#16a34a'
        });
      }
    });
  }

  const btnTestCloud = $('#btnTestCloud');
  if (btnTestCloud) {
    btnTestCloud.addEventListener('click', async () => {
      if (!API.isConnected()) {
        toast('error', 'กรุณาระบุ URL ก่อน');
        return;
      }
      loading('กำลังซิงค์ข้อมูลจาก Google Sheets...');
      const ok = await API.syncAllFromCloud();
      closeLoading();
      if (ok) {
        toast('success', 'ซิงค์ข้อมูลล่าสุดจาก Google Sheets สำเร็จ');
        render();
      } else {
        toast('error', 'ซิงค์ข้อมูลล้มเหลว');
      }
    });
  }

  const btnSyncSheets = $('#btnSyncClassSheets');
  if (btnSyncSheets) {
    btnSyncSheets.addEventListener('click', async () => {
      if (!API.isConnected()) {
        toast('error', 'กรุณาเชื่อมต่อ Google Sheets ในหน้าตั้งค่าก่อน');
        return;
      }
      loading('กำลังสร้างและอัปเดตชีทแยกรายห้องใน Google Sheets...');
      const cur = currentTerm();
      const res = await API.request('syncAllClassSheets', { termId: cur?.id });
      closeLoading();
      if (res && res.status === 'success') {
        Swal.fire({
          icon:'success',
          title:'สร้างชีทรายห้องสำเร็จ!',
          text: res.summary || 'ระบบได้แยก Sheet สรุปผลตามห้องเรียนให้เรียบร้อยแล้วใน Google Spreadsheet',
          confirmButtonColor: getSettings().primary || '#16a34a'
        });
      } else {
        toast('error', 'เกิดข้อผิดพลาดในการสร้างชีท');
      }
    });
  }

  // 9. Logo Upload to Drive
  const pickLogo = $('#pickLogo');
  if (pickLogo) {
    pickLogo.addEventListener('click', () => $('#logoFile').click());
    $('#logoFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;

      loading('กำลังอัปโหลดโลโก้...');
      const reader = new FileReader();
      reader.onload = async ev => {
        const base64 = ev.target.result;
        let driveUrl = null;
        if (API.isConnected()) {
          driveUrl = await API.uploadFileToDrive(file.name, file.type, base64);
        }
        const s = getSettings();
        s.logo = driveUrl || base64;
        DB.set('settings', s);
        if (API.isConnected()) API.request('saveSettings', { data: s });
        closeLoading();
        toast('success', 'อัปโหลดโลโก้สำเร็จเรียบร้อย');
        render();
      };
      reader.readAsDataURL(file);
    });
  }

  const delLogo = $('#delLogo');
  if (delLogo) {
    delLogo.addEventListener('click', async () => {
      if (!await confirmDelete('ต้องการลบโลโก้ปัจจุบันหรือไม่?')) return;
      const s = getSettings();
      s.logo = '';
      DB.set('settings', s);
      if (API.isConnected()) API.request('saveSettings', { data: s });
      toast('success', 'ลบโลโก้แล้ว');
      render();
    });
  }

  const saveSchool = $('#saveSchool');
  if (saveSchool) {
    saveSchool.addEventListener('click', () => {
      const s = getSettings();
      s.school = $('#schoolName').value.trim();
      DB.set('settings', s);
      if (API.isConnected()) API.request('saveSettings', { data: s });
      toast('success', 'บันทึกชื่อสถานศึกษาเรียบร้อย');
      render();
    });
  }

  // 10. Profile Password Change
  const pw = $('#pwForm');
  if (pw) {
    pw.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(pw);
      const users = getUsers();
      const idx = users.findIndex(x => String(x.id) === String(state.user.id));
      if (users[idx].password !== fd.get('old')) { toast('error','รหัสผ่านปัจจุบันไม่ถูกต้อง'); return; }
      users[idx].password = fd.get('nw');
      DB.set('users', users);
      state.user = users[idx];
      if (API.isConnected()) API.request('saveUser', { data: users[idx] });
      pw.reset();
      toast('success','เปลี่ยนรหัสผ่านเรียบร้อย');
    });
  }
}

/* ============================================================
   11. AUTHENTICATION
============================================================ */
async function openLogin(){
  const r = await Swal.fire({
    title:'เข้าสู่ระบบ',
    html:`
      <div class="space-y-3 text-left">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ชื่อผู้ใช้</label>
          <input id="sw-u" class="swal2-input !m-0 !w-full !text-sm" placeholder="เช่น admin หรือ teacher" value="admin">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">รหัสผ่าน</label>
          <input id="sw-p" type="password" class="swal2-input !m-0 !w-full !text-sm" placeholder="รหัสผ่าน" value="admin1234">
        </div>
      </div>`,
    showCancelButton:true, confirmButtonText:'เข้าสู่ระบบ',
    cancelButtonText:'ยกเลิก', confirmButtonColor:getSettings().primary || '#16a34a',
    preConfirm: () => {
      const u = $('#sw-u').value.trim();
      const p = $('#sw-p').value;
      if (!u || !p) { Swal.showValidationMessage('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return false; }
      return { u, p };
    }
  });
  if (!r.isConfirmed) return;

  const user = getUsers().find(x => x.username === r.value.u && x.password === r.value.p);
  if (!user) {
    Swal.fire({ icon:'error', title:'เข้าสู่ระบบไม่สำเร็จ', text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', confirmButtonColor:getSettings().primary || '#16a34a' });
    return;
  }

  state.user = user;
  DB.set('session', user.id);
  toast('success', `ยินดีต้อนรับ ${user.fullname}`);
  state.view = user.role === 'admin' ? 'a-dashboard' : 't-dashboard';
  state.dashTerm = (currentTerm()||{}).id;
  render();
}

async function doLogout(){
  if (!await confirmLogout()) return;
  state.user = null;
  DB.del('session');
  state.view = 'home';
  toast('success','ออกจากระบบแล้ว');
  render();
}

/* ============================================================
   12. INITIALIZATION
============================================================ */
(function boot(){
  seed();
  applyTheme();
  $('#yy').textContent = new Date().getFullYear() + 543;

  const sid = DB.get('session', null);
  if (sid) {
    const u = getUsers().find(x => String(x.id) === String(sid));
    if (u) { state.user = u; state.view = u.role === 'admin' ? 'a-dashboard' : 't-dashboard'; }
  }
  state.dashTerm = (currentTerm() || {}).id;

  render();

  if (API.isConnected()) {
    API.syncAllFromCloud().then(ok => {
      if (ok) render();
    });
  }
})();
</script>
</body>
</html>
