const API = {
  isConnected() {
    return !!CONFIG.getScriptUrl();
  },
  async request(action, data = {}) {
    const url = CONFIG.getScriptUrl();
    if (!url) return null;
    try {
      const payload = { action, ...data };
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    } catch (e) {
      console.warn('API Request Failed:', e);
      return { status: 'error', message: e.message };
    }
  },
  async syncAllFromCloud() {
    const res = await this.request('getAll');
    if (res && res.data) {
      if (res.data.settings) DB.set('settings', res.data.settings);
      if (res.data.users) DB.set('users', res.data.users);
      if (res.data.terms) DB.set('terms', res.data.terms);
      if (res.data.subjectGroups) DB.set('subjectGroups', res.data.subjectGroups);
      if (res.data.subjects) DB.set('subjects', res.data.subjects);
      if (res.data.classes) DB.set('classes', res.data.classes);
      if (res.data.students) DB.set('students', res.data.students);
      if (res.data.topics) DB.set('topics', res.data.topics);
      if (res.data.evaluations) DB.set('evaluations', res.data.evaluations);
      return true;
    }
    return false;
  },
  async uploadFileToDrive(filename, mimeType, base64) {
    if (!this.isConnected()) return null;
    const res = await this.request('uploadFile', { filename, mimeType, base64 });
    if (res && res.url) return res.url;
    return null;
  }
};

/* ============================================================
   4. COMPUTATION & EVALUATION LOGIC
============================================================ */
function leavesOf(node){
  if (!node.children || !node.children.length) return [node];
  return node.children.flatMap(leavesOf);
}

function computeFromTopics(scores, topicList){
  if (!topicList || !topicList.length) return { avg:0, level:0, topics:[] };
  const topicStats = topicList.map(t => {
    const lv = leavesOf(t);
    const vals = lv.map(l => (scores[l.id] !== undefined ? num(scores[l.id]) : null)).filter(v => v !== null);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    return { id:t.id, name:t.name, avg, level:levelFromAvg(avg), count: vals.length, total: lv.length };
  });
  const validAvgs = topicStats.filter(t => t.count > 0).map(t => t.avg);
  const avg = validAvgs.length ? validAvgs.reduce((a,b)=>a+b,0) / validAvgs.length : 0;
  return { avg, level:levelFromAvg(avg), topics: topicStats };
}

function evalResult(ev){
  const topics = getTopics();
  return computeFromTopics(ev.scores || {}, topics[ev.type] || []);
}

function buildDashboard(termId){
  const evs = getEvals().filter(e => e.termId === termId);
  const students = getStudents();
  const byStudent = {};
  evs.forEach(e => {
    const r = evalResult(e);
    (byStudent[e.studentId] = byStudent[e.studentId] || []).push(r.avg);
  });

  const rows = [];
  Object.keys(byStudent).forEach(sid => {
    const st = students.find(s => s.id === sid);
    if (!st) return;
    const cls = classById(st.classId);
    const avg = byStudent[sid].reduce((a,b)=>a+b,0) / byStudent[sid].length;
    rows.push({ studentId:sid, level: cls ? cls.level : '-', clsId: st.classId, avg, q: levelFromAvg(avg) });
  });

  const avgOf = arr => arr.length ? arr.reduce((a,b)=>a+b.avg,0)/arr.length : 0;
  const school = { avg: avgOf(rows), count: rows.length, level: 0 };
  school.level = levelFromAvg(school.avg);

  const lowerRows = rows.filter(r => LOWER.includes(r.level));
  const upperRows = rows.filter(r => UPPER.includes(r.level));
  const lower = { avg: avgOf(lowerRows), count: lowerRows.length }; lower.level = levelFromAvg(lower.avg);
  const upper = { avg: avgOf(upperRows), count: upperRows.length }; upper.level = levelFromAvg(upper.avg);

  const byLevel = BIG_LEVELS.map(lv => {
    const rr = rows.filter(r => r.level === lv);
    const a = avgOf(rr);
    return { level: lv, avg: a, q: levelFromAvg(a), count: rr.length };
  });

  const dist = [3,2,1,0].map(q => rows.filter(r => r.q === q).length);
  return { school, lower, upper, byLevel, dist, total: rows.length };
}

          </button>
        </div>
      </form>
    </div>
  </div>`;

  const close = () => {
    root.innerHTML = '';
    const top = document.body.style.top;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, parseInt(top || '0') * -1);
  };

  $$('[data-close]', root).forEach(b => b.addEventListener('click', close));
  root.firstElementChild.addEventListener('mousedown', e => {
    if (e.target === e.currentTarget) close();
  });

  $('#mForm', root).addEventListener('submit', async e => {
    e.preventDefault();
    const btn = root.querySelector('button[type="submit"]');
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> กำลังบันทึก...'; btn.disabled = true;
    try {
      const ok = await onSubmit(new FormData(e.target), close);
      if (ok !== false) close();
    } catch(err){ console.error(err); toast('error','เกิดข้อผิดพลาด'); }
    finally { btn.innerHTML = old; btn.disabled = false; }
  });

  return { close, root };
}

function pager(total, page, per, key){
  if (total <= per) return '';
  const pages = Math.ceil(total/per);
  let btns = '';
  const start = Math.max(1, Math.min(page-2, pages-4));
  const end = Math.min(pages, start+4);
  for (let i = start; i <= end; i++){
    btns += `<button data-pg="${key}:${i}" class="h-8 min-w-8 rounded-lg px-2 text-xs font-semibold ${i===page?'text-white':'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}"
      ${i===page?'style="background:var(--c-primary)"':''}>${i}</button>`;
  }
  return `<div class="flex flex-wrap items-center justify-between gap-2 px-1 pt-3">
    <span class="text-xs text-slate-500">ทั้งหมด ${total} รายการ · หน้า ${page}/${pages}</span>
    <div class="flex items-center gap-1">
      <button data-pg="${key}:${Math.max(1,page-1)}" class="h-8 rounded-lg border border-slate-200 bg-white px-2 text-xs text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chevron-left"></i></button>
      ${btns}
      <button data-pg="${key}:${Math.min(pages,page+1)}" class="h-8 rounded-lg border border-slate-200 bg-white px-2 text-xs text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chevron-right"></i></button>
    </div></div>`;
}

}
function hexSoft(hex, alpha=.16){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}

      </h3>

      </h3>
      <div class="mt-4 h-[280px]"><canvas id="chartDist"></canvas></div>
    </div>
  </div>`;

  chart('chartByLevel', {
    type:'bar',
    data:{
      labels: d.byLevel.map(r => r.level),
      datasets:[{
        label:'ค่าเฉลี่ย',
        data: d.byLevel.map(r => Number(fmt(r.avg))),

function viewEvaluate(){

    subjectId: subjects[0]?.id || '',
    type: 'lower',
    classId: ''
  };

  const classOptions = classes.filter(c => (f.type==='lower'?LOWER:UPPER).includes(c.level));

    f.classId = classOptions[0]?.id || '';
  }

  return `
  <div class="fade-in space-y-4">
    ${pageHeader('แบบประเมินสมรรถนะสำคัญของผู้เรียน','เลือกรายวิชา ระดับ และห้องเรียนเพื่อทำการประเมิน','fa-clipboard-check','')}

          <label class="label"><i class="fa-solid fa-calendar-days mr-1"></i>ภาคเรียน/ปีการศึกษา</label>
          <input class="input bg-slate-50 text-slate-500" value="${termLabel(cur)}" readonly>

          <label class="label"><i class="fa-solid fa-book mr-1"></i>รายวิชา</label>
          <select id="evSubject" class="select">
            ${groups.map(g => {
              const list = subjects.filter(s => s.groupId === g.id);
              if (!list.length) return '';
              return `<optgroup label="${esc(g.name)}">
                ${list.map(s => `<option value="${s.id}" ${s.id===f.subjectId?'selected':''}>${esc(s.name)}</option>`).join('')}
              </optgroup>`;
            }).join('')}
          </select>
        </div>
        <div>
          <label class="label"><i class="fa-solid fa-layer-group mr-1"></i>ระดับชั้น</label>
          <select id="evType" class="select">
            <option value="lower" ${f.type==='lower'?'selected':''}>มัธยมศึกษาตอนต้น (ม.1 - ม.3)</option>
            <option value="upper" ${f.type==='upper'?'selected':''}>มัธยมศึกษาตอนปลาย (ม.4 - ม.6)</option>
          </select>

        <div>
          <label class="label"><i class="fa-solid fa-door-open mr-1"></i>ห้องเรียน</label>
          <select id="evClass" class="select">
            ${classOptions.length ? classOptions.map(c => `<option value="${c.id}" ${c.id===f.classId?'selected':''}>${esc(c.name)} (${esc(c.level)})</option>`).join('')
                                  : '<option value="">— ไม่มีชั้นเรียนในระดับนี้ —</option>'}
          </select>
        </div>
      </div>
    </div>

    <div id="evList"></div>
  </div>`;
}

function renderEvalList(){
  const box = $('#evList'); if (!box) return;
  const f = state._evalForm;
  const cur = currentTerm();
  if (!cur || !f.classId || !f.subjectId){
    box.innerHTML = `<div class="card grid place-items-center p-12 text-center text-slate-400">กรุณาเลือกรายวิชาและห้องเรียน</div>`;
    return;
  }
  const students = getStudents().filter(s => s.classId === f.classId).sort((a,b) => num(a.number)-num(b.number));
  const evs = getEvals().filter(e => e.termId === cur.id && e.subjectId === f.subjectId && e.classId === f.classId);

  const results = students.map(s => {
    const ev = evs.find(e => e.studentId === s.id);
    return { s, ev, r: ev ? evalResult(ev) : null };
  });

  const doneList = results.filter(x => x.r);
  const classAvg = doneList.length ? doneList.reduce((a,b)=>a+b.r.avg,0)/doneList.length : 0;

  box.innerHTML = `
  <div class="card overflow-hidden">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 bg-slate-50/70 px-4 py-3">
      <div class="flex items-center gap-2">
        <span class="badge" style="background:var(--c-primary-soft);color:var(--c-primary-dark)">${esc(classById(f.classId)?.name||'')}</span>
        <span class="badge bg-slate-100 text-slate-600">นักเรียน ${students.length} คน</span>
        <span class="badge ${doneList.length===students.length?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">
          ประเมินแล้ว ${doneList.length}/${students.length}
        </span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-500">ค่าเฉลี่ยห้อง:</span>
        <span class="text-lg font-bold" style="color:${LEVEL_INFO[levelFromAvg(classAvg)].hex}">${doneList.length?fmt(classAvg):'-'}</span>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="tbl">
        <thead><tr><th>เลขที่</th><th>ชื่อ - นามสกุล</th><th>สถานะ</th><th>ค่าเฉลี่ย</th><th>ระดับคุณภาพ</th><th class="text-right">จัดการ</th></tr></thead>
        <tbody>
          ${results.map(x => `
            <tr>
              <td class="font-semibold text-slate-600">${esc(x.s.number)}</td>
              <td class="font-medium text-slate-700">${esc(x.s.name)}</td>
              <td>${x.r ? '<span class="badge bg-green-100 text-green-700"><i class="fa-solid fa-check"></i>ประเมินแล้ว</span>'
                        : '<span class="badge bg-slate-100 text-slate-500"><i class="fa-solid fa-clock"></i>รอประเมิน</span>'}</td>
              <td class="font-semibold" style="color:${x.r?LEVEL_INFO[x.r.level].hex:'#cbd5e1'}">${x.r?fmt(x.r.avg):'-'}</td>
              <td>${x.r?levelBadge(x.r.level):'<span class="text-xs text-slate-300">—</span>'}</td>
              <td class="text-right">
                <button data-eval="${x.s.id}" class="btn ${x.r?'btn-ghost':'btn-primary'} h-8 px-3 text-xs">
                  <i class="fa-solid ${x.r?'fa-pen':'fa-clipboard-check'}"></i> ${x.r?'แก้ไข':'ประเมิน'}
                </button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function openEvalModal(studentId){
  const f = state._evalForm;
  const cur = currentTerm();
  const student = studentById(studentId);
  if (!student || !cur) return;

  const topics = (getTopics()[f.type] || []);
  const existing = getEvals().find(e =>
    e.termId === cur.id && e.subjectId === f.subjectId &&
    e.studentId === studentId && e.type === f.type);
  const currentScores = existing ? { ...(existing.scores || {}) } : {};

  // ล็อกการเลื่อนของ body ข้างหลัง
  const prevScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${prevScrollY}px`;
  document.body.style.width = '100%';

  const root = $('#modalRoot');

  // สร้างเนื้อหาโครงสร้างต้นไม้

    ? topics.map((t, i) => renderEvalNode(t, currentScores, 0, i + 1)).join('')
    : '<p class="py-12 text-center text-sm text-slate-400">ยังไม่มีรายการหัวข้อประเมิน</p>';

  const close = () => {
    root.innerHTML = '';
    const top = document.body.style.top;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, parseInt(top || '0') * -1);
  };

  $$('[data-eval-close]', root).forEach(b => b.addEventListener('click', close));

  // ฟังก์ชันอัปเดตคะแนนสด โดยไม่แตะต้อง Scroll Container เลย
  const updateSummary = () => {
    const res = computeFromTopics(currentScores, topics);
    const avgEl = $('#liveAvg', root);
    const badgeEl = $('#liveBadge', root);
    if (avgEl) {
      avgEl.textContent = fmt(res.avg);
      avgEl.style.color = LEVEL_INFO[res.level].hex;
    }
    if (badgeEl) {
      badgeEl.innerHTML = `<span class="badge ${LEVEL_INFO[res.level].cls}">${LEVEL_INFO[res.level].label}</span>`;
    }

    // อัปเดต progress badges ของแต่ละกลุ่มหัวข้อ
    $$('[data-topicbox]', root).forEach(box => {
      try {
        const ids = JSON.parse(box.dataset.leaves || '[]');
        const done = ids.filter(id => currentScores[id] !== undefined).length;
        const tag = box.querySelector('[data-progress]');
        if (tag) {
          tag.textContent = `${done}/${ids.length}`;
          tag.className = 'badge ' + (done === 0 ? 'bg-slate-100 text-slate-500'
                            : done === ids.length ? 'bg-green-100 text-green-700'
                            : 'bg-amber-100 text-amber-700');
        }
      } catch (err){}
    });
  };

  // ✅ การดักจับคลิกเลือกคะแนนแบบ Direct Button Click (ไม่มี scroll-jump / ไม่มี blur freeze)
  const evalTree = $('#evalTree', root);
  evalTree.addEventListener('click', e => {
    const btn = e.target.closest('.eval-choice-btn');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    const nodeId = btn.dataset.nid;
    const val = Number(btn.dataset.val);

    // อัปเดตข้อมูลคะแนนใน state
    currentScores[nodeId] = val;

    // อัปเดตสไตล์เฉพาะแถวที่เลือก โดยไม่รีเรนเดอร์ทั้งหน้า
    const parentRow = btn.closest('[data-choice-row]');
    if (parentRow) {
      parentRow.classList.add('bg-green-50/50', 'border-green-300');
      parentRow.classList.remove('bg-white', 'border-slate-100');

      const siblings = parentRow.querySelectorAll('.eval-choice-btn');

        } else {
          s.className = 'eval-choice-btn h-8 w-8 rounded-lg text-xs font-semibold border border-slate-200 bg-white text-slate-500 hover:bg-slate-100';
        }
      });
    }

    updateSummary();
  });

  // เรียกคำนวณครั้งแรก
  updateSummary();

  // บันทึกผลการประเมิน
  // บันทึกผลการประเมิน
$('#btnSaveEval', root).addEventListener('click', async () => {
  const saveBtn = $('#btnSaveEval', root);
  const old = saveBtn.innerHTML;
  saveBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> กำลังบันทึก...';
  saveBtn.disabled = true;

  try {
    const res = computeFromTopics(currentScores, topics);
    const evs = getEvals();
    const idx = evs.findIndex(e =>
      e.termId === cur.id && e.subjectId === f.subjectId &&
      e.studentId === studentId && e.type === f.type);

    const payload = {
      id: idx >= 0 ? evs[idx].id : uid(),
      termId: cur.id,
      subjectId: f.subjectId,
      classId: f.classId,
      studentId,
      teacherId: state.user.id,
      type: f.type,
      scores: currentScores,
      avg: Number(fmt(res.avg)),
      level: res.level,
      updatedAt: new Date().toISOString()
    };

    if (idx >= 0) evs[idx] = payload;
    else evs.push(payload);

    DB.set('evaluations', evs);

    // ✅ sync ไป Google Sheets แบบรอผล
    if (API.isConnected()) {
      const r = await API.request('saveEvaluation', { data: payload });
      if (!r || r.status !== 'success') {
        console.error('saveEvaluation failed:', r);
        toast('error', 'บันทึกออนไลน์ไม่สำเร็จ (บันทึกในเครื่องแล้ว)');
      }
    }

    close();
    toast('success', 'บันทึกผลการประเมินเรียบร้อยแล้ว');
    render();
  } catch (err) {
    console.error(err);
    toast('error', 'เกิดข้อผิดพลาดในการบันทึก');
    saveBtn.innerHTML = old;
    saveBtn.disabled = false;
  }
});
}

/**
 * เรนเดอร์ข้อคำถามแบบ Button-based (ไม่มี Radio input ก่อปัญหาการ Focus Scroll)
 */
function renderEvalNode(node, scores, depth, prefix){
  const kids = node.children || [];
  if (!kids.length){
    const v = scores[node.id];
    return `
    <div data-choice-row class="flex flex-col gap-2 rounded-xl border p-2.5 sm:flex-row sm:items-center sm:justify-between transition ${v!==undefined?'border-green-300 bg-green-50/50':'border-slate-100 bg-white'}"
         style="margin-left:${Math.min(depth,3)*8}px">
      <p class="text-[13px] leading-snug text-slate-700 flex-1">${esc(node.name)}</p>
      <div class="flex shrink-0 gap-1.5 self-end sm:self-auto">
        ${[3,2,1,0].map(n => {
          const isSelected = (v === n);
          const btnClass = isSelected
            ? LEVEL_INFO[n].btnCls
            : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100';
          return `
            <button type="button" class="eval-choice-btn h-8 w-8 rounded-lg text-xs font-bold border transition ${btnClass}"
                    data-nid="${node.id}" data-val="${n}">
              ${n}
            </button>`;
        }).join('')}
      </div>
    </div>`;
  }

  const leaves = leavesOf(node).map(l => l.id);
  return `
  <div data-topicbox data-leaves='${JSON.stringify(leaves)}' class="rounded-2xl border border-slate-100 bg-white p-3 shadow-xs"
       style="margin-left:${Math.min(depth,2)*6}px">
    <div class="flex items-center justify-between gap-2 border-b border-slate-50 pb-2">
      <p class="text-sm font-bold text-slate-800">${depth===0?`<span class="mr-1" style="color:var(--c-primary)">${prefix}.</span>`:''}${esc(node.name)}</p>
      <span data-progress class="badge bg-slate-100 text-slate-500">0/${leaves.length}</span>
    </div>
    <div class="mt-2 space-y-2">${kids.map((c,i) => renderEvalNode(c, scores, depth+1, `${prefix}.${i+1}`)).join('')}</div>
  </div>`;
}

  const t = (topics[type]||[]).find(x => x.id === b.dataset.editTopic);
  if (!t) return;
  openModal({
    title:'แก้ไขหัวข้อหลัก', icon:'fa-pen-to-square',
    body:`<div><label class="label">ชื่อหัวข้อหลัก *</label>
          <input name="name" class="input" required value="${esc(t.name)}"></div>`,
    submitText:'บันทึก',
    onSubmit: async fd => {
      t.name = fd.get('name').trim();
      DB.set('topics', topics);
      await _saveTopics();
      toast('success', 'แก้ไขหัวข้อสำเร็จ');
      render();
    }
  });
}));

$$('[data-edit-sub]').forEach(b => b.addEventListener('click', () => {
  const parentId = b.dataset.parent;
  const subId = b.dataset.editSub;
  const topics = getTopics();
  const type = state._topicType || 'lower';
  const t = (topics[type]||[]).find(x => x.id === parentId);
  const sub = t?.children?.find(c => c.id === subId);
  if (!sub) return;
  openModal({
    title:'แก้ไขข้อย่อย', icon:'fa-pen-to-square',
    body:`<div><label class="label">ชื่อข้อย่อย *</label>
          <input name="name" class="input" required value="${esc(sub.name)}"></div>`,
    submitText:'บันทึก',
    onSubmit: async fd => {
      sub.name = fd.get('name').trim();
      DB.set('topics', topics);
      await _saveTopics();
      toast('success', 'แก้ไขข้อย่อยสำเร็จ');
      render();
    }
  });
}));

$$('[data-del-sub]').forEach(b => b.addEventListener('click', async () => {
  if (!await confirmDelete('ลบข้อย่อยนี้?')) return;
  const parentId = b.dataset.parent;
  const subId = b.dataset.delSub;
  const topics = getTopics();
  const type = state._topicType || 'lower';
  const t = (topics[type]||[]).find(x => x.id === parentId);
  if (!t) return;
  t.children = (t.children||[]).filter(c => c.id !== subId);
  DB.set('topics', topics);
  await _saveTopics();
  toast('success', 'ลบข้อย่อยแล้ว');
  render();
}));
  }

  // Profile password
  const pw = $('#pwForm');
  if (pw) {
    pw.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(pw);
      const users = getUsers();
      const idx = users.findIndex(x => x.id === state.user.id);
      if (users[idx].password !== fd.get('old')) { toast('error','รหัสผ่านปัจจุบันไม่ถูกต้อง'); return; }
      users[idx].password = fd.get('nw');
      DB.set('users', users);
      state.user = users[idx];
      if (API.isConnected()) API.request('saveUser', { data: users[idx] });
      pw.reset();
      toast('success','เปลี่ยนรหัสผ่านเรียบร้อย');
    });
  }
}

/* ============================================================
   11. AUTHENTICATION
============================================================ */
async function openLogin(){
  const r = await Swal.fire({
    title:'เข้าสู่ระบบ',
    html:`
      <div class="space-y-3 text-left">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ชื่อผู้ใช้</label>
          <input id="sw-u" class="swal2-input !m-0 !w-full !text-sm" placeholder="username" value="admin">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">รหัสผ่าน</label>
          <input id="sw-p" type="password" class="swal2-input !m-0 !w-full !text-sm" placeholder="password" value="admin1234">
        </div>
      </div>`,
    showCancelButton:true, confirmButtonText:'เข้าสู่ระบบ',
    cancelButtonText:'ยกเลิก', confirmButtonColor:getSettings().primary || '#16a34a',
    preConfirm: () => {
      const u = $('#sw-u').value.trim();
      const p = $('#sw-p').value;
      if (!u || !p) { Swal.showValidationMessage('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return false; }
      return { u, p };
    }
  });
  if (!r.isConfirmed) return;

  const user = getUsers().find(x => x.username === r.value.u && x.password === r.value.p);
  if (!user) {
    Swal.fire({ icon:'error', title:'เข้าสู่ระบบไม่สำเร็จ', text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', confirmButtonColor:getSettings().primary });
    return;
  }

  state.user = user;
  DB.set('session', user.id);
  toast('success', `ยินดีต้อนรับ ${user.fullname}`);
  state.view = user.role === 'admin' ? 'a-dashboard' : 't-dashboard';
  state.dashTerm = (currentTerm()||{}).id;
  render();
}

async function doLogout(){
  if (!await confirmLogout()) return;
  state.user = null;
  DB.del('session');
  state.view = 'home';
  toast('success','ออกจากระบบแล้ว');
  render();
}

/* ============================================================
   12. INITIALIZATION
============================================================ */
(function boot(){
  seed();
  applyTheme();
  $('#yy').textContent = new Date().getFullYear() + 543;

  const sid = DB.get('session', null);
  if (sid) {
    const u = getUsers().find(x => x.id === sid);
    if (u) { state.user = u; state.view = u.role === 'admin' ? 'a-dashboard' : 't-dashboard'; }
  }
  state.dashTerm = (currentTerm() || {}).id;

  render();

  // ✅ Global delegation สำหรับปุ่ม "ประเมิน" (ทนต่อการ re-render)
  $('#app').addEventListener('click', e => {
    const b = e.target.closest('[data-eval]');
    if (b) {
      e.preventDefault();
      openEvalModal(b.dataset.eval);
    }
  });

  // ✅ ถ้าเชื่อมต่อ cloud → ล้าง topics ที่ seed แบบ uid เก่า แล้ว sync ใหม่
  if (API.isConnected()) {
    const firstId = DB.get('topics', {lower:[]})?.lower?.[0]?.id || '';
    if (firstId && !firstId.startsWith('tp_')) {
      DB.del('topics');
      DB.del('evaluations'); // ล้าง eval เก่าที่ใช้ ID ผิด (ถ้าไม่ต้องการให้ comment บรรทัดนี้)
    }
    API.syncAllFromCloud().then(ok => {
      if (ok) render();
    });
  }
})();
</script>
