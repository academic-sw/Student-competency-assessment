<script>
/* ============================================================
   GAS & GOOGLE DRIVE CONFIGURATION
============================================================ */
// Google Drive Folder ID ตามที่ผู้ใช้ระบุ
const DEFAULT_DRIVE_FOLDER_ID = "1ehgB_CLugTr96TwYLTbSISYyO4K5rGob";

const getGasUrl = () => localStorage.getItem('sh_gas_url') || 'https://script.google.com/macros/s/AKfycbzNRMu5S5A2Hs15p3zUAy6lB-Bw4FH3qqduWOPabXbn6SxapktbeWNlZqjj60lXtpII/exec';
const setGasUrl = url => localStorage.setItem('sh_gas_url', url.trim());

/* ============================================================
   UTILITIES
============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const LEVELS = ['ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'];
const JUNIOR = ['ม.1','ม.2','ม.3'];

const LEVELS_META = [
  { n:3, label:'ดีเยี่ยม',        cls:'bg-emerald-100 text-emerald-700', color:'#10b981' },
  { n:2, label:'ดี',              cls:'bg-sky-100 text-sky-700',         color:'#0ea5e9' },
  { n:1, label:'พอใช้/ผ่านเกณฑ์', cls:'bg-amber-100 text-amber-700',     color:'#f59e0b' },
  { n:0, label:'ปรับปรุง',        cls:'bg-rose-100 text-rose-700',       color:'#f43f5e' },
];

function levelOf(avg){
  if (avg === null || avg === undefined || isNaN(avg)) return null;
  if (avg >= 2.5) return LEVELS_META[0];
  if (avg >= 1.5) return LEVELS_META[1];
  if (avg >= 0.5) return LEVELS_META[2];
  return LEVELS_META[3];
}
function levelBadge(avg){
  const lv = levelOf(avg);
  if (!lv) return `<span class="badge bg-slate-100 text-slate-400">ยังไม่มีข้อมูล</span>`;
  return `<span class="badge ${lv.cls}">${lv.n} · ${lv.label}</span>`;
}
function levelColor(avg){
  const lv = levelOf(avg);
  return lv ? lv.color : '#cbd5e1';
}
function lighten(hex, amt = .85){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    const nr = Math.round(r + (255-r)*amt), ng = Math.round(g + (255-g)*amt), nb = Math.round(b + (255-b)*amt);
    return '#' + [nr,ng,nb].map(x => x.toString(16).padStart(2,'0')).join('');
  }catch(e){ return '#dcfce7'; }
}
const fmt = n => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(2);

/* ============================================================
   STORAGE (LocalStorage Cache + Cloud Sync)
============================================================ */
const S = {
  get(k, d){ try{ const v = localStorage.getItem('sh_' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('sh_' + k, JSON.stringify(v)); }
};

/* ============================================================
   CLOUD API (GOOGLE APPS SCRIPT)
============================================================ */
async function gasApi(action, payload = {}) {
  const url = getGasUrl();
  if (!url) {
    console.warn('ยังไม่ได้ระบุ Web App URL ของ Google Apps Script');
    return null;
  }
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload })
    });
    return await response.json();
  } catch (err) {
    console.error('GAS API Error:', err);
    return null;
  }
}

// ซิงค์ข้อมูลทั้งหมดขึ้น Google Sheets
async function syncToGoogleSheets(silent = false) {
  const url = getGasUrl();
  if (!url) {
    if (!silent) alertErr('ไม่พบการเชื่อมต่อ', 'กรุณาระบุ URL ของ Google Apps Script ในหน้าตั้งค่าก่อน');
    return false;
  }
  if (!silent) toast('info', 'กำลังบันทึกลง Google Sheet...');
  const allData = {
    settings: S.get('settings', {}),
    users: S.get('users', []),
    terms: S.get('terms', []),
    categories: S.get('categories', []),
    subjects: S.get('subjects', []),
    classes: S.get('classes', []),
    students: S.get('students', []),
    topics: S.get('topics', {})
  };
  const res = await gasApi('saveAllData', { data: allData });
  if (res && res.status === 'success') {
    if (!silent) alertOk('สำเร็จ', 'บันทึกข้อมูลและแยกห้องใน Google Sheets เรียบร้อย');
    return true;
  } else {
    if (!silent) alertErr('เกิดข้อผิดพลาด', res ? res.message : 'ไม่สามารถเชื่อมต่อได้');
    return false;
  }
}
window.syncToGoogleSheets = syncToGoogleSheets;

// ดึงข้อมูลทั้งหมดจาก Google Sheets มาอัปเดต Local Cache
async function fetchFromGoogleSheets() {
  const url = getGasUrl();
  if (!url) return;
  try {
    const res = await fetch(url + '?action=getAllData').then(r => r.json());
    if (res && res.status === 'success' && res.data) {
      const d = res.data;
      if (d.settings) S.set('settings', d.settings);
      if (d.users && d.users.length) S.set('users', d.users);
      if (d.terms && d.terms.length) S.set('terms', d.terms);
      if (d.categories && d.categories.length) S.set('categories', d.categories);
      if (d.subjects && d.subjects.length) S.set('subjects', d.subjects);
      if (d.classes && d.classes.length) S.set('classes', d.classes);
      if (d.students && d.students.length) S.set('students', d.students);
      if (d.topics && (d.topics.junior || d.topics.senior)) S.set('topics', d.topics);
      if (d.evals && d.evals.length) S.set('evals', d.evals);
      applyTheme();
      render();
    }
  } catch(e) {
    console.log('Online fetch skipped, using offline cache');
  }
}

/* ============================================================
   DEFAULT CATEGORIES
============================================================ */
const DEFAULT_CATEGORIES = [
  'ภาษาไทย','คณิตศาสตร์','วิทยาศาสตร์และเทคโนโลยี','สังคมศึกษา ศาสนาและวัฒนธรรม',
  'สุขศึกษาและพลศึกษา','ศิลปะ','การงานอาชีพ','ภาษาต่างประเทศ','อื่น ๆ'
];

const getCategories = () => S.get('categories', DEFAULT_CATEGORIES);
const saveCategories = arr => { S.set('categories', arr); syncToGoogleSheets(true); };

/* ============================================================
   SEED DATA
============================================================ */
function defaultTopics(){
  const mk = (titles) => titles.map(t => ({
    id: uid(), title: t,
    subs: [
      { id: uid(), title: 'ด้านที่ 1' },
      { id: uid(), title: 'ด้านที่ 2' },
      { id: uid(), title: 'ด้านที่ 3' },
    ]
  }));
  const five = [
    'ความสามารถในการสื่อสาร',
    'ความสามารถในการคิด',
    'ความสามารถในการแก้ปัญหา',
    'ความสามารถในการใช้ทักษะชีวิต',

  if (!localStorage.getItem('sh_settings')){

  }

  }

  }
  if (!localStorage.getItem('sh_categories')){
    S.set('categories', [...DEFAULT_CATEGORIES]);
  }
  if (!localStorage.getItem('sh_subjects')){

      'ภาษาไทย': ['ภาษาไทยพื้นฐาน','ภาษาไทยเพิ่มเติม'],
      'คณิตศาสตร์': ['คณิตศาสตร์พื้นฐาน','คณิตศาสตร์เพิ่มเติม'],
      'วิทยาศาสตร์และเทคโนโลยี': ['วิทยาศาสตร์พื้นฐาน','วิทยาการคำนวณ'],
      'สังคมศึกษา ศาสนาและวัฒนธรรม': ['สังคมศึกษาพื้นฐาน','ประวัติศาสตร์'],

/* ============================================================
   APP STATE
============================================================ */
const App = {
  view: 'home',
  user: null,
  termId: null,
  params: {},
  expanded: {},
  drafts: {},
  charts: {},
  loading: true
};

const getTerms    = () => S.get('terms', []);
const getClasses  = () => S.get('classes', []);
const getStudents = () => S.get('students', []);
const getSubjects = () => S.get('subjects', []);
const getEvals    = () => S.get('evals', []);
const getSettings = () => S.get('settings', { logo:'', primary:'#16a34a', accent:'#facc15' });
const getTopics   = () => S.get('topics', { junior:[], senior:[] });

const getCurrentTerm = () => getTerms().find(t => t.isCurrent) || getTerms()[0] || null;
const termLabel = t => t ? `ภาคเรียนที่ ${t.semester}/${t.year}` : '—';

const studentsOf = classId => getStudents().filter(s => s.classId === classId).sort((a,b) => (a.number||0) - (b.number||0));
const classById  = id => getClasses().find(c => c.id === id);
const subjectById= id => getSubjects().find(s => s.id === id);
const levelOfClass = classId => { const c = classById(classId); return c ? c.level : null; };

/* ============================================================
   CALCULATIONS
============================================================ */
function evalAvg(rec){
  const vals = Object.values(rec.scores || {}).filter(v => v !== null && v !== undefined && v !== '');
  if (!vals.length) return null;
  return vals.reduce((a,b) => a + Number(b), 0) / vals.length;
}
function agg(avgs){
  if (!avgs.length) return { avg:null, level:null, n:0 };
  const avg = avgs.reduce((a,b) => a + b, 0) / avgs.length;
  return { avg, level: levelOf(avg), n: avgs.length };
}
function computeStats(termId){
  const evals = getEvals().filter(e => termId === 'all' || e.termId === termId);
  const recs = evals.map(e => ({ e, avg: evalAvg(e) })).filter(r => r.avg !== null);

  const all     = recs.map(r => r.avg);
  const junior  = recs.filter(r => JUNIOR.includes(levelOfClass(r.e.classId))).map(r => r.avg);
  const senior  = recs.filter(r => !JUNIOR.includes(levelOfClass(r.e.classId))).map(r => r.avg);

  const byLevel = LEVELS.map(lv => {
    const a = recs.filter(r => levelOfClass(r.e.classId) === lv).map(r => r.avg);
    const stat = agg(a);
    return { levelName: lv, avg: stat.avg, levelObj: stat.level, n: stat.n };
  });

  const dist = { 3:0, 2:0, 1:0, 0:0 };
  recs.forEach(r => { const lv = levelOf(r.avg); if (lv) dist[lv.n]++; });

  return { school: agg(all), junior: agg(junior), senior: agg(senior), byLevel, dist, total: recs.length };
}

  root.style.setProperty('--c-accent', st.accent || '#facc15');

}

/* ============================================================
   AUTH
============================================================ */
function restoreSession(){
  const sid = localStorage.getItem('sh_session');
  if (!sid) return;
  const u = S.get('users', []).find(x => x.id === sid);
  if (u) App.user = u;
}
function openLogin(){
  const rem = S.get('remember', null);
  openModal({
    title:'เข้าสู่ระบบ', size:'sm',
    body:`
      <div class="space-y-3">
        <div>
          <label class="lbl">ชื่อผู้ใช้ (Username)</label>
          <input id="lg-user" class="input" value="${rem ? esc(rem.username) : ''}" placeholder="กรอกชื่อผู้ใช้" autocomplete="username">
        </div>
        <div>
          <label class="lbl">รหัสผ่าน (Password)</label>
          <div class="relative">
            <input id="lg-pass" type="password" class="input pr-10" value="${rem ? esc(rem.password) : ''}" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
            <button type="button" onclick="togglePw('lg-pass',this)" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
          <input id="lg-rem" type="checkbox" ${rem ? 'checked' : ''} class="w-4 h-4 accent-green-600 rounded">
          จดจำชื่อผู้ใช้และรหัสผ่าน
        </label>
        <p class="text-xs text-slate-400 bg-slate-50 rounded-lg p-2.5 leading-relaxed">
          <i data-lucide="info" class="w-3.5 h-3.5 inline -mt-0.5"></i>
          
        </p>
      </div>`,
    saveText:'เข้าสู่ระบบ',
    onSave: doLogin
  });
  setTimeout(() => $('#lg-pass')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }), 50);
}
function togglePw(id, btn){
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.innerHTML = `<i data-lucide="${el.type === 'password' ? 'eye' : 'eye-off'}" class="w-4 h-4"></i>`;
  lucide.createIcons();
}
window.togglePw = togglePw;

function doLogin(){
  const u = $('#lg-user').value.trim();
  const p = $('#lg-pass').value;
  if (!u || !p){ toast('warning','กรุณากรอกข้อมูลให้ครบ'); return; }
  const found = S.get('users', []).find(x => x.username === u && x.password === p);
  if (!found){ alertErr('เข้าสู่ระบบไม่สำเร็จ','ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); return; }

  if ($('#lg-rem').checked) S.set('remember', { username:u, password:p });
  else localStorage.removeItem('sh_remember');

  App.user = found;
  localStorage.setItem('sh_session', found.id);
  closeModal();
  toast('success', `ยินดีต้อนรับ ${found.fullName}`);
  nav(found.role === 'admin' ? 'admin-dashboard' : 'teacher-dashboard');
}
window.doLogin = doLogin;

async function logout(){
  if (!await confirmLogout()) return;
  App.user = null;
  localStorage.removeItem('sh_session');
  toast('success','ออกจากระบบแล้ว');
  nav('home');
}
window.logout = logout;

            <button type="button" onclick="togglePw('uf-pass',this)" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div>
          <label class="lbl">ชื่อ-นามสกุล <span class="text-rose-500">*</span></label>

        </div>
        <div>
          <label class="lbl">สิทธิ์การใช้งาน <span class="text-rose-500">*</span></label>
          <select id="uf-role" class="input" onchange="togglePositionField()">
            <option value="teacher" ${u && u.role === 'teacher' ? 'selected' : ''}>ครู</option>

          </select>
        </div>
        <div id="uf-pos-wrap" class="${u && u.role === 'admin' ? 'hidden' : ''}">
          <label class="lbl">ตำแหน่ง</label>

      const fullName = $('#uf-name').value.trim();

      let users = S.get('users', []);
      const dup = users.find(x => x.username === username && x.id !== id);

function userChangePw(id){
  const u = S.get('users', []).find(x => x.id === id);
  openModal({
    title: `เปลี่ยนรหัสผ่าน — ${u.fullName}`, size:'sm',
    body: `
      <div class="space-y-3">
        <div>
          <label class="lbl">รหัสผ่านใหม่</label>

async function userDelete(id){

function subjectForm(id){
  const s = id ? getSubjects().find(x => x.id === id) : null;
  const cats = getCategories();
  const options = cats.map(c => `<option value="${esc(c)}" ${s && s.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
  openModal({
    title: s ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชา',
    size:'sm',
    body: `
      <div class="space-y-3">
        <div>
          <label class="lbl">กลุ่มสาระ / หมวดหมู่ <span class="text-rose-500">*</span></label>
          <select id="sf-cat" class="input" onchange="subjectCatChange()">
            ${options}
            <option value="__new__">＋ เพิ่มหมวดหมู่ใหม่...</option>
          </select>
          <input id="sf-newcat" class="input mt-2 hidden" placeholder="พิมพ์ชื่อหมวดหมู่ใหม่ เช่น ภาษาจีน">
        </div>
        <div>
          <label class="lbl">ชื่อรายวิชา <span class="text-rose-500">*</span></label>
          <input id="sf-name" class="input" value="${s ? esc(s.name) : ''}" placeholder="เช่น คณิตศาสตร์พื้นฐาน">
        </div>
      </div>`,
    onSave: () => {
      let category = $('#sf-cat').value;
      const name = $('#sf-name').value.trim();
      if (category === '__new__'){
        category = ($('#sf-newcat').value || '').trim();
        if (!category){ toast('warning','กรุณากรอกชื่อหมวดหมู่ใหม่'); return; }
        const cats = getCategories();
        if (!cats.includes(category)){
          cats.push(category);
          saveCategories(cats);
        }
      }
      if (!name){ toast('warning','กรุณากรอกชื่อรายวิชา'); return; }

      let subjects = getSubjects();
      if (s){
        const idx = subjects.findIndex(x => x.id === id);
        subjects[idx] = { ...subjects[idx], category, name };
      } else {
        subjects.push({ id: uid(), category, name });
      }
      S.set('subjects', subjects);
      syncToGoogleSheets(true);
      closeModal(); toast('success','บันทึกรายวิชาแล้ว'); render();
    }
  });
}
window.subjectForm = subjectForm;

function subjectCatChange(){
  const sel = $('#sf-cat');
  const inp = $('#sf-newcat');
  if (sel.value === '__new__'){
    inp.classList.remove('hidden');
    inp.focus();
  } else {
    inp.classList.add('hidden');
    inp.value = '';
  }
}
window.subjectCatChange = subjectCatChange;

    hideFooter:true,

          <table class="tbl">

                  <td class="text-center text-slate-500">${cnt}</td>

                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="btn btn-ghost btn-sm !p-1.5 text-rose-500" onclick="deleteCategory('${esc(c).replace(/'/g,"\\'")}')">

              }).join('')}

  });

function addCategoryFromModal(){
  const name = $('#cat-new').value.trim();
  if (!name){ toast('warning','กรุณากรอกชื่อหมวดหมู่'); return; }
  const cats = getCategories();
  if (cats.includes(name)){ alertErr('มีหมวดหมู่นี้อยู่แล้ว'); return; }
  cats.push(name);
  saveCategories(cats);
  toast('success','เพิ่มหมวดหมู่แล้ว');
  closeModal(); categoryManager();
}
window.addCategoryFromModal = addCategoryFromModal;

async function deleteCategory(name){
  const used = getSubjects().filter(s => s.category === name).length;
  const msg = used ? `มีรายวิชา ${used} รายวิชาในหมวดนี้ การลบหมวดหมู่จะไม่ลบรายวิชา` : 'ต้องการลบหมวดหมู่นี้หรือไม่?';
  if (!await confirmDelete(msg)) return;
  saveCategories(getCategories().filter(c => c !== name));
  toast('success','ลบหมวดหมู่แล้ว');
  closeModal(); categoryManager();
}
window.deleteCategory = deleteCategory;

function renameCategory(name){
  const neu = prompt('แก้ไขชื่อหมวดหมู่:', name);
  if (neu === null) return;
  const trimmed = neu.trim();
  if (!trimmed){ toast('warning','กรุณากรอกชื่อใหม่'); return; }
  const cats = getCategories();
  if (trimmed !== name && cats.includes(trimmed)){ alertErr('มีหมวดหมู่นี้อยู่แล้ว'); return; }
  const idx = cats.indexOf(name);
  if (idx < 0) return;
  cats[idx] = trimmed;
  saveCategories(cats);
  const subjects = getSubjects().map(s => s.category === name ? { ...s, category: trimmed } : s);
  S.set('subjects', subjects);
  syncToGoogleSheets(true);
  toast('success','แก้ไขชื่อหมวดหมู่แล้ว');
  closeModal(); render(); categoryManager();
}
window.renameCategory = renameCategory;

async function subjectDelete(id){
  const s = getSubjects().find(x => x.id === id);
  if (!await confirmDelete(`ต้องการลบรายวิชา "${s.name}" หรือไม่?`)) return;
  S.set('subjects', getSubjects().filter(x => x.id !== id));
  syncToGoogleSheets(true);

function studentBulkForm(classId){
  openModal({
    title:'เพิ่มนักเรียนหลายคน',
    body: `
      <div class="space-y-3">
        <p class="text-xs text-slate-500 bg-slate-50 rounded-lg p-2.5">
          กรอกข้อมูลบรรทัดละ 1 คน ในรูปแบบ <b>เลขที่ ชื่อ-นามสกุล</b><br>
          ตัวอย่าง: <code class="text-primary">1 เด็กชายสมชาย ใจดี</code>
        </p>
        <textarea id="bulk-text" class="input" rows="10" placeholder="1 เด็กชายสมชาย ใจดี&#10;2 เด็กหญิงสมศรี มีสุข"></textarea>
      </div>`,
    saveText:'เพิ่มรายชื่อ',
    onSave: () => {
      const lines = $('#bulk-text').value.split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length){ toast('warning','กรุณากรอกข้อมูล'); return; }
      const students = getStudents();
      let added = 0;
      lines.forEach(line => {
        const m = line.match(/^(\d+)[\s.\-–)]+(.+)$/);
        let num, name;
        if (m){ num = Number(m[1]); name = m[2].trim(); }
        else { num = students.filter(s => s.classId === classId).length + added + 1; name = line; }
        students.push({ id: uid(), classId, number: num, name });
        added++;
      });
      S.set('students', students);
      syncToGoogleSheets(true);
      closeModal(); toast('success', `เพิ่มนักเรียน ${added} คนแล้ว`); render();
    }
  });
}
window.studentBulkForm = studentBulkForm;

function studentImportExcel(classId){
  openModal({
    title:'นำเข้ารายชื่อจาก Excel',
    body: `
      <div class="space-y-3">
        <p class="text-xs text-slate-500 bg-slate-50 rounded-lg p-2.5 leading-relaxed">
          ไฟล์ Excel (.xlsx / .xls / .csv) ควรมีคอลัมน์:<br>
          คอลัมน์ A = เลขที่, คอลัมน์ B = ชื่อ-นามสกุล<br>
          (หากไม่มีหัวตาราง ระบบจะอ่านแถวแรกเป็นข้อมูลทันที)
        </p>
        <input id="excel-file" type="file" accept=".xlsx,.xls,.csv"
               class="input file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-primary-soft file:text-primary file:font-medium file:text-xs">
        <div id="excel-preview"></div>
      </div>`,
    saveText:'นำเข้ารายชื่อ',
    onSave: () => {
      const f = $('#excel-file').files[0];
      if (!f){ toast('warning','กรุณาเลือกไฟล์'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false });
          const students = getStudents();
          let added = 0;
          rows.forEach(r => {
            if (!r || !r.length) return;
            let num = r[0], name = r[1];
            if (typeof num === 'string' && isNaN(Number(num))) return;
            if (!name) { name = r[0]; num = null; }
            const nm = String(name || '').trim();
            if (!nm) return;
            students.push({
              id: uid(), classId,
              number: num != null && !isNaN(Number(num)) ? Number(num) : students.filter(s => s.classId === classId).length + 1,
              name: nm
            });
            added++;
          });
          if (!added){ alertErr('ไม่พบข้อมูล','กรุณาตรวจสอบรูปแบบไฟล์'); return; }
          S.set('students', students);
          syncToGoogleSheets(true);
          closeModal(); toast('success', `นำเข้านักเรียน ${added} คนแล้ว`); render();
        }catch(err){ alertErr('อ่านไฟล์ไม่สำเร็จ', err.message); }
      };
      reader.readAsArrayBuffer(f);
    }
  });
}
window.studentImportExcel = studentImportExcel;

async function subTopicDelete(type, topicId, subId){
  if (!await confirmDelete('ต้องการลบหัวข้อย่อยนี้หรือไม่?')) return;
  const d = getTopics();
  const tp = d[type].find(x => x.id === topicId);
  tp.subs = tp.subs.filter(s => s.id !== subId);
  S.set('topics', d);
  syncToGoogleSheets(true);

}

function reportTeachersHTML(){

    const avgs = my.map(evalAvg).filter(a => a !== null);

    return { u, my, classes, avg };
  });

  return `
  <div class="space-y-4">
    ${rows.length ? rows.map(({ u, my, classes, avg }) => {
      const groups = {};
      my.forEach(e => {
        const k = [e.termId, e.subjectId, e.classId].join('|');
        (groups[k] = groups[k] || []).push(e);
      });
      return `
      <div class="card p-4">

          <div class="flex items-center gap-2.5">

            </div>
          </div>
          <div class="text-right">
            <p class="text-xs text-slate-400">ค่าเฉลี่ยรวม</p>
            <p class="font-bold text-lg" style="color:${levelColor(avg)}">${fmt(avg)}</p>
            ${levelBadge(avg)}
          </div>
        </div>
        ${Object.keys(groups).length ? `
        <div class="table-wrap rounded-xl border border-slate-100">
          <table class="tbl">
            <thead>
              <tr>
                <th>ภาคเรียน/ปีการศึกษา</th><th>รายวิชา</th><th>ชั้นเรียน</th>
                <th class="text-center">จำนวนนักเรียน</th><th class="text-center">ค่าเฉลี่ย</th><th class="text-center">ระดับคุณภาพ</th>
              </tr>

              ${Object.entries(groups).map(([k, list]) => {
                const term = getTerms().find(t => t.id === list[0].termId);
                const subj = subjectById(list[0].subjectId);
                const cls = classById(list[0].classId);
                const avgs = list.map(evalAvg).filter(a => a !== null);
                const a = avgs.length ? avgs.reduce((x,y) => x+y, 0) / avgs.length : null;
                return `<tr>
                  <td class="text-slate-500 text-xs">${esc(termLabel(term))}</td>
                  <td class="font-medium">${esc(subj ? subj.name : '—')}</td>
                  <td>${esc(cls ? cls.name : '—')}</td>
                  <td class="text-center">${list.length}</td>
                  <td class="text-center font-semibold" style="color:${levelColor(a)}">${fmt(a)}</td>
                  <td class="text-center">${levelBadge(a)}</td>
                </tr>`;
              }).join('')}

function reportRiskHTML(){
  const termId = App.params.termId || (getCurrentTerm()?.id ?? 'all');
  const levelFilter = App.params.level || '';
  const q = (App.params.q || '').toLowerCase();
  const limit = Number(App.params.limit || 10);

  const headerAndFilters = `
    <div class="card p-4 space-y-4">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="font-semibold text-slate-800">รายชื่อนักเรียนที่ควรได้รับการพัฒนา</h2>
          <p class="text-xs text-slate-400">เรียงจากค่าเฉลี่ยสมรรถนะต่ำสุด</p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div>
          <label class="lbl">ภาคเรียน/ปีการศึกษา</label>
          <select class="input" onchange="nav('admin-reports',{tab:'risk',termId:this.value,level:'${levelFilter}',limit:'${limit}',q:'${esc(q)}'})">
            <option value="all" ${termId === 'all' ? 'selected' : ''}>ทั้งหมด</option>
            ${getTerms().map(t => `<option value="${t.id}" ${termId === t.id ? 'selected' : ''}>${termLabel(t)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="lbl">ระดับชั้น <span class="text-rose-500">*</span></label>
          <select class="input" onchange="nav('admin-reports',{tab:'risk',termId:'${termId}',level:this.value,limit:'${limit}',q:'${esc(q)}'})">
            <option value="">— กรุณาเลือกระดับชั้น —</option>
            ${LEVELS.map(l => `<option value="${l}" ${levelFilter === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="lbl">จำนวนที่แสดง</label>
          <select class="input" onchange="nav('admin-reports',{tab:'risk',termId:'${termId}',level:'${levelFilter}',limit:this.value,q:'${esc(q)}'})">
            ${[10,25,50,100].map(n => `<option value="${n}" ${limit === n ? 'selected' : ''}>${n} อันดับแรก</option>`).join('')}
            <option value="0" ${limit === 0 ? 'selected' : ''}>ทั้งหมด</option>
          </select>
        </div>
        <div>
          <label class="lbl">ค้นหาชื่อ-นามสกุล</label>
          <input class="input" value="${esc(q)}" placeholder="พิมพ์ชื่อ..."
                 onkeydown="if(event.key==='Enter')nav('admin-reports',{tab:'risk',termId:'${termId}',level:'${levelFilter}',limit:'${limit}',q:this.value})">
        </div>
      </div>
    </div>`;

  if (!levelFilter){
    return `
    <div class="space-y-4">
      ${headerAndFilters}
      <div class="card p-10 text-center">
        <i data-lucide="mouse-pointer-click" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i>
        <p class="text-slate-500 font-medium">กรุณาเลือกระดับชั้นเพื่อแสดงข้อมูล</p>
        <p class="text-xs text-slate-400 mt-1">ตัวอย่าง: ม.1, ม.2, ม.3, ม.4, ม.5, ม.6</p>
      </div>
    </div>`;
  }

  const evals = getEvals().filter(e => termId === 'all' || e.termId === termId);
  const byStudent = {};
  evals.forEach(e => {
    const a = evalAvg(e);
    if (a === null) return;
    (byStudent[e.studentId] = byStudent[e.studentId] || []).push(a);
  });

  let list = Object.entries(byStudent).map(([sid, arr]) => {
    const s = getStudents().find(x => x.id === sid);
    const cls = s ? classById(s.classId) : null;
    const avg = arr.reduce((a,b) => a+b, 0) / arr.length;
    return { s, cls, avg, count: arr.length };
  }).filter(r => r.s && r.cls);

  list = list.filter(r => r.cls.level === levelFilter);
  if (q) list = list.filter(r => r.s.name.toLowerCase().includes(q));

  list.sort((a,b) => a.avg - b.avg);
  const shown = limit === 0 ? list : list.slice(0, limit);

  return `
  <div class="space-y-4">
    ${headerAndFilters}
    <div class="card p-4">
      <div class="table-wrap rounded-xl border border-slate-100">
        <table class="tbl">
          <thead>
            <tr>
              <th class="w-12">#</th><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ชั้นเรียน</th>
              <th class="text-center">จำนวนวิชาที่ประเมิน</th><th class="text-center">ค่าเฉลี่ย</th><th class="text-center">ระดับคุณภาพ</th>
            </tr>
          </thead>
          <tbody>
            ${shown.length ? shown.map((r, i) => `
              <tr>
                <td class="text-slate-400">${i+1}</td>
                <td><span class="badge bg-slate-100 text-slate-600">${esc(r.s.number)}</span></td>
                <td class="font-medium text-slate-700">${esc(r.s.name)}</td>
                <td>${esc(r.cls.name)}</td>
                <td class="text-center">${r.count}</td>
                <td class="text-center font-semibold" style="color:${levelColor(r.avg)}">${fmt(r.avg)}</td>
                <td class="text-center">${levelBadge(r.avg)}</td>
              </tr>`).join('')
              : `<tr><td colspan="7" class="text-center py-10 text-slate-400">ไม่พบข้อมูลในระดับชั้น ${levelFilter}</td></tr>`}
          </tbody>
        </table>
      </div>
      ${list.length > shown.length ? `<p class="text-xs text-slate-400 text-center mt-3">แสดง ${shown.length} จากทั้งหมด ${list.length} รายชื่อ</p>` : ''}
    </div>
  </div>`;
}

async function uploadLogoCloud(input){
  const f = input.files[0];
  if (!f) return;
  toast('info', 'กำลังอัปโหลดโลโก้...');
  const reader = new FileReader();
  reader.onload = async e => {
    const base64Data = e.target.result;
    let finalUrl = base64Data;

    // ถ้าเชื่อมต่อ Google Apps Script ให้อัปโหลดลง Drive Folder ทันที
    if (getGasUrl()) {
      const res = await gasApi('uploadFile', {
        base64Data: base64Data,
        fileName: 'logo_' + Date.now() + '_' + f.name,
        mimeType: f.type || 'image/png'
      });
      if (res && res.status === 'success' && res.url) {
        finalUrl = res.url;
      }
    }

    const st = getSettings();
    st.logo = finalUrl;
    S.set('settings', st);
    syncToGoogleSheets(true);
    toast('success','บันทึกโลโก้แล้ว');
    render();
  };
  reader.readAsDataURL(f);
}
window.uploadLogoCloud = uploadLogoCloud;

function exportData(){

function filterSubjects(q){
  const sel = $('#subj-select');
  if (!sel) return;
  q = q.trim().toLowerCase();
  [...sel.querySelectorAll('option')].forEach(o => {
    if (!o.value) return;
    o.hidden = q && !o.textContent.toLowerCase().includes(q);
  });
}
window.filterSubjects = filterSubjects;

function evalSelect(key, value){
  App.params[key] = value;
  App.expanded = {};
  App.drafts = {};
  render();
}
window.evalSelect = evalSelect;

function topicsOf(type){ return getTopics()[type] || []; }
function allSubIds(type){ return topicsOf(type).flatMap(t => t.subs.map(s => s.id)); }

function ensureDrafts(){
  const { subjectId, classId, type } = App.params;
  const term = getCurrentTerm();
  if (!term || !subjectId || !classId || !type) return;
  const evals = getEvals();
  studentsOf(classId).forEach(st => {
    if (App.drafts[st.id] !== undefined) return;
    const rec = evals.find(e => e.termId === term.id && e.subjectId === subjectId &&
                                e.classId === classId && e.studentId === st.id && e.type === type);
    App.drafts[st.id] = rec ? { ...rec.scores } : {};
  });
}

    const d = App.drafts[st.id] || {};

function toggleStudent(id){
  App.expanded[id] = !App.expanded[id];
  render();
  if (App.expanded[id]){
    setTimeout(() => {
      const el = document.querySelector(`[data-student-panel="${id}"]`);
      if (el) refreshStudentState(id);
    }, 30);
  }
}
window.toggleStudent(toggleStudent);

function pickScore(btn, studentId, subId, val){
  App.drafts[studentId] = App.drafts[studentId] || {};
  App.drafts[studentId][subId] = val;
  const grp = btn.parentElement;
  [...grp.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  refreshStudentState(studentId);
}
window.pickScore = pickScore;

function refreshStudentState(studentId){
  const panel = document.querySelector(`[data-student-panel="${studentId}"]`);
  if (!panel) return;
  const d = App.drafts[studentId] || {};
  const topics = topicsOf(App.params.type);

  panel.querySelectorAll('.topic-block').forEach(block => {
    const tid = block.dataset.topic;
    const topic = topics.find(t => t.id === tid);
    if (!topic) return;
    const doneCount = topic.subs.filter(s => d[s.id] !== undefined && d[s.id] !== null).length;
    const badge = block.querySelector('.topic-state');
    block.classList.remove('border-primary', 'border-emerald-300');
    if (doneCount === 0){
      badge.className = 'badge topic-state bg-slate-100 text-slate-400';
      badge.textContent = 'ยังไม่ประเมิน';
    } else if (doneCount < topic.subs.length){
      badge.className = 'badge topic-state bg-amber-100 text-amber-700';
      badge.textContent = `ประเมินแล้ว ${doneCount}/${topic.subs.length}`;
      block.classList.add('border-primary');
    } else {
      badge.className = 'badge topic-state bg-emerald-100 text-emerald-700';
      badge.textContent = '✓ ประเมินครบแล้ว';
      block.classList.add('border-emerald-300');
    }
  });

  const vals = Object.values(d).filter(v => v !== undefined && v !== null);
  const avgEl = panel.querySelector('.stu-avg');
  if (avgEl){
    if (vals.length){
      const avg = vals.reduce((a,b) => a + Number(b), 0) / vals.length;
      avgEl.innerHTML = `ค่าเฉลี่ย ${fmt(avg)} ${levelBadge(avg)}`;
    } else {
      avgEl.innerHTML = '<span class="text-slate-400 text-xs">ยังไม่มีคะแนน</span>';
    }
  }
}

async function saveEvaluation(studentId){
  const { subjectId, classId, type } = App.params;
  const term = getCurrentTerm();
  const d = App.drafts[studentId] || {};
  const subIds = allSubIds(type);
  const scores = {};
  subIds.forEach(id => { if (d[id] !== undefined && d[id] !== null) scores[id] = d[id]; });

  if (!Object.keys(scores).length){ toast('warning','กรุณาให้คะแนนอย่างน้อย 1 หัวข้อ'); return; }

  const scoreVals = Object.values(scores);
  const avg = scoreVals.reduce((a, b) => a + Number(b), 0) / scoreVals.length;
  const lv = levelOf(avg);

  const student = getStudents().find(s => s.id === studentId);
  const cls = classById(classId);
  const subj = subjectById(subjectId);

  let evals = getEvals();
  const idx = evals.findIndex(e => e.termId === term.id && e.subjectId === subjectId &&
                                   e.classId === classId && e.studentId === studentId && e.type === type);
  
  const evalObj = {
    id: idx >= 0 ? evals[idx].id : uid(),
    termId: term.id,
    subjectId,
    classId,
    studentId,
    type,
    teacherId: App.user.id,
    scores,
    updatedAt: Date.now()
  };

  if (idx >= 0){
    evals[idx] = evalObj;
  } else {
    evals.push(evalObj);
  }
  S.set('evals', evals);
  toast('success','บันทึกผลการประเมินแล้ว');
  render();

  // ซิงค์ไปยัง Google Sheets และอัปเดตชีทแยกห้องอัตโนมัติ
  if (getGasUrl()) {
    gasApi('saveEvaluation', {
      evaluation: {
        id: evalObj.id,
        termId: term.id,
        semesterYear: termLabel(term),
        teacherName: App.user.fullName,
        subjectName: subj ? subj.name : '',
        className: cls ? cls.name : '',
        studentNumber: student ? student.number : '',
        studentName: student ? student.name : '',
        avgScore: Number(avg.toFixed(2)),
        levelText: lv ? `${lv.n} - ${lv.label}` : '',
        scores: scores
      }
    });
  }
}
window.saveEvaluation = saveEvaluation;

            <i data-lucide="chevron-left" class="w-4 h-4"></i>ก่อนหน้า
          </button>
          ${Array.from({ length: totalPages }, (_, i) => i + 1)
            .filter(p => p === 1 || p === totalPages || Math.abs(p - page) <= 1)
            .map((p, idx, arr) => {
              const prev = arr[idx - 1];
              const gap = prev && p - prev > 1 ? `<span class="px-1 text-slate-300">…</span>` : '';
              const btn = `<button class="btn ${p === page ? 'btn-primary' : 'btn-outline'} btn-sm !px-2.5" onclick="histPage(${p})">${p}</button>`;
              return gap + btn;
            }).join('')}
          <button class="btn btn-outline btn-sm" ${page >= totalPages ? 'disabled' : ''} onclick="histPage(${page + 1})">
            ถัดไป<i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

function histPage(p){
  App.params.histPage = p;
  render();
}
window.histPage = histPage;

function changeMyPassword(){
  openModal({
    title:'เปลี่ยนรหัสผ่านของฉัน', size:'sm',
    body: `
      <div class="space-y-3">
        <div>
          <label class="lbl">รหัสผ่านเดิม</label>
          <input id="mp-old" type="password" class="input" placeholder="กรอกรหัสผ่านเดิม">
        </div>
        <div>
          <label class="lbl">รหัสผ่านใหม่</label>
          <input id="mp-new" type="password" class="input" placeholder="กรอกรหัสผ่านใหม่">
        </div>
        <div>
          <label class="lbl">ยืนยันรหัสผ่านใหม่</label>
          <input id="mp-conf" type="password" class="input" placeholder="กรอกรหัสผ่านอีกครั้ง">
        </div>
      </div>`,
    saveText:'บันทึก',
    onSave: () => {
      const oldPw = $('#mp-old').value;
      const a = $('#mp-new').value;
      const b = $('#mp-conf').value;
      if (oldPw !== App.user.password){ alertErr('รหัสผ่านเดิมไม่ถูกต้อง'); return; }
      if (!a || a.length < 4){ toast('warning','รหัสผ่านใหม่สั้นเกินไป'); return; }
      if (a !== b){ alertErr('รหัสผ่านใหม่ไม่ตรงกัน'); return; }
      const users = S.get('users', []);
      const idx = users.findIndex(x => x.id === App.user.id);
      users[idx].password = a;
      S.set('users', users);
      App.user = users[idx];
      syncToGoogleSheets(true);
      closeModal(); toast('success','เปลี่ยนรหัสผ่านเรียบร้อย'); render();
    }
  });
}
window.changeMyPassword = changeMyPassword;

/* ============================================================
   AFTER RENDER — CHARTS
============================================================ */
function destroyCharts(){
  Object.values(App.charts).forEach(c => { try{ c.destroy(); }catch(e){} });
  App.charts = {};
}

function afterRender(){
  destroyCharts();
  if (App.view !== 'home' && App.view !== 'admin-dashboard' && App.view !== 'teacher-dashboard') return;

  const termId = App.termId || (getCurrentTerm()?.id ?? 'all');
  const st = computeStats(termId);

  // Bar chart — ค่าเฉลี่ยตามระดับชั้น
  const barCtx = document.getElementById('chart-level');
  if (barCtx){
    App.charts.bar = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: st.byLevel.map(l => l.levelName),
        datasets: [{
          label: 'ค่าเฉลี่ย',
          data: st.byLevel.map(l => l.avg !== null ? Number(l.avg.toFixed(2)) : 0),
          backgroundColor: st.byLevel.map(l => l.avg !== null ? levelColor(l.avg) : '#e2e8f0'),
          borderRadius: 10,
          maxBarThickness: 58,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: c => {
                const l = st.byLevel[c.dataIndex];
                const lv = levelOf(l.avg);
                return l.avg === null ? ' ยังไม่มีข้อมูล'
                  : ` ค่าเฉลี่ย ${fmt(l.avg)} · ระดับ ${lv.n} ${lv.label} (${l.n} รายการ)`;
              }
            }
          }
        },
        scales: {
          y: { beginAtZero: true, max: 3, ticks: { stepSize: 1, color: '#94a3b8' }, grid: { color: '#f1f5f9' } },
          x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 12 } } }
        }
      }
    });
  }

  // Doughnut — สัดส่วนระดับคุณภาพ
  const pieCtx = document.getElementById('chart-dist');
  if (pieCtx){
    const values = [st.dist[3], st.dist[2], st.dist[1], st.dist[0]];
    const total = values.reduce((a,b) => a+b, 0);
    App.charts.pie = new Chart(pieCtx, {
      type: 'doughnut',
      data: {
        labels: LEVELS_META.map(l => `${l.n} · ${l.label}`),
        datasets: [{
          data: total ? values : [1],
          backgroundColor: total ? LEVELS_META.map(l => l.color) : ['#e2e8f0'],
          borderWidth: 3,
          borderColor: '#fff',
          hoverOffset: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '64%',
        plugins: {
          legend: { position: 'bottom', labels: { font: { family:'Sarabun', size: 11 }, color:'#64748b', boxWidth: 12, padding: 10 } },
          tooltip: {
            callbacks: {
              label: c => total ? ` ${c.label}: ${c.parsed} รายการ (${((c.parsed/total)*100).toFixed(1)}%)` : ' ยังไม่มีข้อมูล'
            }
          }
        }
      }
    });
  }
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  restoreSession();
  const cur = getCurrentTerm();
  App.termId = cur ? cur.id : 'all';

  if (App.user){
    const fresh = S.get('users', []).find(u => u.id === App.user.id);
    if (fresh) App.user = fresh; else { App.user = null; localStorage.removeItem('sh_session'); }
  }

  if (App.user) App.view = App.user.role === 'admin' ? 'admin-dashboard' : 'teacher-dashboard';
  else App.view = 'home';

  renderWithSkeleton();

  // ดึงข้อมูลล่าสุดจาก Google Sheets (ถ้ามีการเชื่อมต่อไว้)
  if (getGasUrl()) {
    fetchFromGoogleSheets();
  }
})();
</script>
